日本と現代がテーマの当チームですが、
令和日本と言えば漫画・アニメだろ！ということで、
架空の少年漫画のMMV（Manga Music Video）というイメージで製作しました。
週刊少年ジャンプを20年以上購読するくらい、昔からアツいバトル漫画が好きで、
少年漫画家になれたらな、なんて漠然と思っていた時期もありましたが、
今回こういった作品を作ることで、今更になって夢が一つ叶ったような気持ちでとても嬉しいです。
僕の夢を叶えていただいたKeiuOさん、焼き鳥さんには心から感謝いたします！
厨二全開で制作したフレーバー設定と共に、皆さんにも熱くプレイして頂けると嬉しいです！
そんな感じでよろしくお願いいたしします。
(ume)
ステゾー_bms の『快落深愛@ブラックホール！』に続いてumeさんの作品に関わらせていただきました！
今回は『ハロー・ワールド』『灰色カナリア』など私自身過去作が大好きな焼き鳥さんがイラストを描いてくださるとのことでド緊張でしたが気合入れて作りました。
サビを聴いた瞬間に、絶対ここでみんなの中にある"厨二"を総立ちにさせてやろうと思ったので、そのようにしていただけると幸いです。
よろしくお願いします。
（KeiuO）
BGA内のイラストを製作させていただきました、焼き鳥です。
チームテーマは『日本・現代』ですが、
自分の描いた白黒1bitイラストは、デジタル配信が主流となり、グレーでの表現が当たり前となった今どきの漫画と比べると絵柄含め古臭いです。
しかしそれをumeさんの曲とKeiuOさんの映像、そして譜面でパッケージングすることでめっちゃかっこよく、今風の少年漫画PVのような仕上がりにしていただけました！
人生で初めて自分の絵を他の方に映像の一部として動かしてもらい、大変興奮してます！
孤独な闘いを描いた本作ですが、チームメンバーそれぞれの情熱が遺憾なく注がれた一品となっています。
ぜひお楽しみください！
（焼き鳥）"""

