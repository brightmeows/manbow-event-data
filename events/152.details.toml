comment = """
(2026年10月19日 00:24 更新)
Description
Advocatus diaboli in the most literal sense. Not the cheap roleplay most take me for. I AM the devil's OWN advocate.
Comments from authors
rareguy
Wait what? Joko is innocent? You sure about that? Against Pearson-Spectre?
Song comment
Jokes aside, do you feel weird listening to this? Well, you should. Even I felt that. Some guy said he likes the number 38, so he did. It's unsettling, right? Anyway, the song was a long time draft that was supposed to be a forever draft. When arenji revived, we intended to just use whatever in our armory, without using external libraries. Default plugins for FL Studio apparently is pretty good (if you buy it) and I realized that as much money that I can pour into plugins and effects, if I didn't know the basics of producing, it will still sound like a big ol' rainbow trout splapping on the floor. Image-Line, please endorse us.
audioTopia
This is literally our first-ever song using only Fruity Loops Studio plugins, and I couldn't be more proud of us. I remember being very strict about it when I proposed the idea to rareguy because I really couldn't be bothered exchanging samples or using plugins we don't both have. It's just a hassle and a half every time we do that. So I was really glad when rareguy was on board with the idea and actually went SO HARD with the sound design, mixing, and everything else on this. All I needed to do was further develop the story of the song from the short riff rareguy had made (the intro of the song) and translate it into fitting harmony and arrangement. I was the happiest man alive when this song was finished, because we actually made a proper rhythm game-esque song. Image-Line, please endorse us.
Charts
Insane Lv15
Another Lv12
Hyper Lv11
Normal Lv8"""

