comment_updated = "2026年10月21日 17:31"
comment = '''
(2026年10月21日 17:31 更新)
(2026年10月19日 16:59 更新)
(2026年10月19日 16:58 更新)
(2026年10月19日 16:17 更新)
SP BEGINNER - ☆02 obj:ハルガスミ
SP NORMAL - ☆05 obj:ハルガスミ
SP HYPER - ☆10 obj:ハルガスミ
SP ANOTHER - ☆12 obj:Tiv
SP INSANE - ☆13 obj:Tiv
◇◆◇◆◇
DLありがとうございます。
和だろうが洋だろうが結局は大きければそれでいい主義のTiv（てぃぶ）です。何とは言いませんが。
ついに実現！ハルガスミさんとの合作です。
これまで、「飲んだくれの青ウサギ」と「rabbies-rabbies」ではボイスでの参加をしてくださいましたが、
今回はなんと作曲も一緒にやっちゃうことに。お声掛けを快諾してくださりありがとうございました！改めて感謝申し上げます。
ガスミさんがそれっぽく仕上げてくれた土台がハイテンポで「ゲームのような疾走感」を感じたので、
ピコピコ音を中心に色々加えさせていただいております。
それと、ドラムに合わせてオシャレに決めたい気持ちもあったので、
ソロパートではピアノで暴れさせていただきました。琴とピアノの殴り合い、良くない？
また、チームメンバーのもるもるさんの作品『雅 ~miyabi~』をリスペクトしたもので、
それにちなんでタイトルには「急須」がはいっているんですね。
万事休すにかけているのも、ハルガスミさんらしくて素敵だなぁと思いました。
イラストは、ハルガスミさんといえば！ということで水森なつるさんにお願いさせていただきました。
この度はありがとうございました！やはりデカい！どことは言わないけど。
バニー×くのいち、みなさん大好物ですよね？ね？（押し付け）
2人のもとに次々襲いかかってくる敵を、日本刀やクナイでなぎ倒していくシーンも想像できますね。
いろんな要素が雅な和風ノリノリ曲をお楽しみ頂けますと幸いです。
◇◆◇◆◇
こんにちは！ハルガスミです。
普段はTwitterに住みつきながら、不定期で"ジェネリック音ゲーVTuber"として
BMS等の音ゲー配信を嗜んでおります(VTuberとして活動しているわけではありません)。
今回はTivさんと合作させて頂きました！
シンプルな作曲経験の少なさと初めての合作で不慣れな点が多く、
またスケジュールも結局かなりギリギリになってしまいとっても迷惑をかけてしまいましたが、
なんとか形になった『万事急須』、かなり満足のいく作品になりました！Tivさん本当にありがとう！
◇◆◇◆◇
-『万事急須』について-
Tivさんにお声掛け頂いた時期に、ちょうどTRI4THの『Rebellion』という楽曲にドハマりしてたんですね。
この楽曲からは"和風バトルジャズ"という印象を受けていて、
いつかこういう感じの楽曲を作ってみたいな～と思ってサビの耳コピをしてたりしてたのですが、そんな時のお声掛けだったので、
"自分とTivさんが敵に囲まれている状況を打開する和風バトルジャズ"ってよくないか？と1つアイデアがこの時点で浮かびました。
そして話は変わりまして…今回弊チーム『うさ亭』にはもるもるさんというメンバーがいます。
BOF:NTの時に『雅 ~miyabi~』というステキな楽曲を作ってくれたのですが、
自分もTivさんも(そしてチームメンバーのYtzkAさんも)この曲のことが本当に大好きなんですね。
こちらも疾走感のある和風ジャズ作品なのですが、
当時作品制作中にBGA担当が失踪してしまったため、急遽BGAを自分で制作をしなくてはならない状況になったそうです。
その際、撮影に使用した急須が他の撮影素材と比べて高価だったという裏話が会場ページに載ってあるのですが、
このエピソードが妙に印象に残っていました。
そんなわけで、『Rebellion』に影響を受けた和風ジャズを作るのであれば、
せっかくだしチームメンバーが大好きな『雅 ~miyabi~』もモチーフにした作品にしよう！という方向性に決定。
楽曲イメージ：敵に囲まれた自分とTivさん
モチーフ楽曲：BGA制作のためには高価な急須であっても買わざるを得ないもるもるさん
どちらもまさに"万事休す"！……ということで、"万事休す"と"急須"を掛け合わせて『万事急須』というタイトルが誕生しました。
どう見てもオヤジギャグです本当にありがとうございました。曲はマジメです。
◇◆◇◆◇
楽曲に関しては、
まず自分がAメロ以降の土台を作る→そこからTivさんが前半の土台を作る
→全体の土台ができたのでより和風ジャズっぽく仕上げる→サビ後のソロパートでメロディーの殴り合い
→Tivさんが全体的に装飾→バランス調整して完成！という流れで仕上げました。
ソロパートで殴り合った時点でほぼほぼ完成していたのですが、どうも全体的に迫力に欠ける印象だったところ、
Tivさんの装飾のおかげで厚みも増してかつかなり音ゲーっぽくもなりました！
今の自分のスキルでは絶対にできない編曲でした。合作ってこういう相乗効果があるのが凄い！勉強になったぜ・・・
『雅 ~miyabi~』のフレーズも引用して楽曲に組み込めましたし、
全体的に『Rebellion』らしい和風バトルジャズっぽさもしっかり表現できたと思います。
(サビの前半とかホントほぼ『Rebellion』そのままで大変恐縮なのですが、どうか温かい目で見て頂けると幸いです。。。)
また上述の通りイラストはいつも通り水森なつるさんに描いて頂きました！
Tivさんの好きなように依頼してOK！という流れになって、最終的に返ってきたのがこのイラストです。デッッッッッッ！
当初時間がなさそうだったのでBGIにする予定だったのですが、せっかくステキなイラストを頂いたいので、
簡単なものではありますが思い切ってBGAを作りました。プレイしながら是非"""圧"""を感じて頂けますと幸いです！
『万事急須』、宜しくお願いします！
★☆★SPECIAL THANKS!!★☆★
イラスト：水森なつる(https://x.com/minanatu)
楽曲モチーフ：『雅 ~miyabi~/ もるもる』『Rebellion / TRI4TH』
『雅 ~miyabi~』の会場ページ：https://manbow.nothing.sh/event/event.cgi?action=More_def&num=95&event=142'''

