Japanese：
最も輝かしい星が現れる前、あの景色は白に包まれていた。
別れがもたらした擦り傷は、あなたと私の心を洗い流す液体へと変わる。
色彩は単調となり、「私たち」という存在は次第に色あせていく。
――あなたと私のかたちはどこへ行けばいいのだろう。
過ぎ去った日々をどう忘れればよい。長年私を苦しめ続けた夢を、どうやって忘れられるのだろう。
儚く消えゆく微かな光は哀れで、高嶺の花は今にも崩れ落ちそうに揺れる。
私のこの痕跡を託そう、「魂」という愚かなものに。
それは何も知らぬまま絆をきつく締め、苦しみに押さえつけられ、深い紅に染まっていく。
――幾度となく湧き上がる熱き思い、それは命の再びの鼓動。
消えゆくあなたをどう取り戻せばよい。もし取り戻せたとしても、予測できない未来にどう向き合えばいいのだろう。
芽吹き始めた新たな命、そして私たちの知らざる真実たち。
高嶺の花は、私たちがまだ辿り着いたことのない場所で再び咲く。
蒼い彼方へと進み、「魂」という悪夢のようなものを探し求めよう。
「大丈夫だよ、もう君を見つけたよ。」
Chinese:
在最耀眼的星星出现前，那一片景象是白色。
用离别所造成的擦伤，化作洗涤你我内心的液体，
色彩的单调，所谓的“我们”逐渐褪色。
——属于你我的形状，该何去何从，
我又该如何去遗忘往事？我又该如何去遗忘曾困扰我那么多年的梦境？
转瞬即逝的微光可怜，高岭之花摇摇欲坠，
将我的这一份痕迹托付，名为“灵魂”的愚拙之物，
它一无所知地收紧束缚，被苦难扼住，遍染猩红。
——多少翻涌起的炽热，那是生命的又一次悸动，
我又该如何挽回将要消逝的你？就算挽回，我又该如何去面对不可预知的未来？
生机勃发的萌芽，与那些我们不曾了解的真相，
高岭之花再一次开放在我们未曾到达的地方，
前去蔚蓝的彼岸，去探寻名为”灵魂“的梦魇之物。
”没事的，我已经找到你了哦。“
亡霊は執着のため彷徨し、願いの力だけがそれらを救い、輪廻に帰らせることができる。——折口信夫《死者の書》
