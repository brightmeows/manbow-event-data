どんべいです。一応リーダーということになってるので登録作業をしてるんですけどついでにコメント残したろと思いまして。
自供するとBOF:TTだったりBた作26とかに出没歴がありまして、部員、というかほとんどchiiyuri君の曲を音切りしてイベントに出していました。
そんな感じで基本曲を作るだけのchiiyuri君だったわけです。
したがってBMSイベントに出すにあたって私に完全依存している形で、「なんだかなぁ、凄い曲作るんだけどなぁ、自由に動けたらもっと良いのに」って思っていた最中、なんと当人が今回のBOFで音切りとそれに伴い譜面制作にチャレンジするとのことでした。
おお
やっとこんな私の手元から離れて一人で自由にBMS作者として旅立てるんだなぁという感激のもと、”可能性への出発”ということで「Departure into Possibility」をタイトルとして推しました。私の発案ですまない。
譜面に関して、彼はAnother譜面を作りまして、しかも初めての譜面制作。第一作目の譜面ですよ第一作。
見てみたら自分が初めて作った譜面の4倍くらい良い譜面でびっくりしたのなんの
Beginner☆2 譜面:どんべい
Normal☆7 譜面：どんべい
Hyper☆11 譜面:どんべい
Another☆12 譜面：chiyuri
INSANE★11 譜面：どんべい
ただ時間が無かったのでこんな具合に、本楽曲では彼の作ったのは一譜面だけ。なのでそれ以外は私の譜面で我慢して下さい。
ーーーーーー
chiiyuriです。
おおじゃないが
今回の曲もマジで難産でした。予定より遅くの完成になってしまったけれど、時間のない中、バリエグい映像を作ってくれたツジさん、ガチヤバい譜面を作ってくれたどんべいくんには本当に感謝でおっぱおです。
どんべいくんのコメントの通り、初めて音切りしたり譜面作ったりしたので粗はあるかと思いますが、楽しんでいただけたら幸いです。
これから曲作りはもちろん、BMS制作も頑張っていくので、よろしくお願いします。
どんべいくんにはこれからも譜面手伝ってもらうわよ？
なぜなら......
chiiyuri"""

