comment_updated = "2026年10月19日 23:52"
comment = """
(2026年10月19日 23:52 更新)
invertebrate - dsktpgrl
bms:dsktpgrl
https://dsktpgrl.com/
mv:Transendium
https://transendium.carrd.co/
team: dandelion sounds
https://dandelion.dsktpgrl.com/
Artist Comments:
dsktpgrl:
this is probably the most serious I've ever taken a BMS project. I wanted to make a powerful trance song that sounds good, plays good, and looks good. I'm fighting back against my habit of using gimmicks or humor to soften the impression my works make, it comes from a place of embarassment, but I'm almost a decade into my career as an artist and I'm confident now in my talent, and I'm even more confident in my role as a leader.
I'm particularly honored to be working with Transendium, who has done amazing work creating visualizers for games and artists all over the rhythm game sphere. He's done a fantastic job and I just keep rewatching the video and giggling in glee seeing my music come to life. (≧◡≦) ♡
I hadn't planned on joining BOF this year, but listening to people talk about BOF on SNS gave me serious FOMO and I realized: I could register a team under my doujin circle, dandelion sounds! we have a bunch of artists hanging around that I can ask, and so I went ahead and started planning. my life has been the perfect amount of busy that I've dropped the ball on some of my duties as leader, but I still think I brought some great artists together.
in terms of the music itself, it all started from a sample I found on my M8 (a handheld music sequencer) that really resonated with me. It's the main arpeggiating synth, it just had this perfect "big room" vibe. I've always wanted to try my hand at making a proper trance track, so a perfect opportunity was staring me in the face. it took a while for me to find all the right elements, test out melodies, and craft presets, but thankfully I had a good headstart so while I'm still crunched for time, I'm much less stressed out than I have been in past years.
something else I'm grateful for: with the removal of the LR2 compatability requirement, the doors have opened to new possibilities. specifically, base62 support!! I wasn't very forward thinking while composing, the main synth plays 16th notes throughout the entire song and I employed generous use of slow, non-repeating automation throughout. simply put, I would not have been able to make this work without base62 support. I think on a larger scale, a new era of BMS has begun, and we'll continue to see more dynamic and boundary-breaking works in the coming years now that we are free from the clutches of our great grandfather LR2's standards. RIP LR2IR.
anyways, please enjoy! <3
Transendium:
🪱🎩💙"""

