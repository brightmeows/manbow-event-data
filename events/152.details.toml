comment = """
Chapter 8 of 8
Upon returning to their home, Aries finds everyone at peace and lays down next to them, closing their eyes.
By piecing back all stones together, humanity actually revealed their true nature: a terraforming device meant to wipe out all sentient beings on the planet.
In a strange twist of fate, the Great Asteroid Crash actually ended up being humanity's salvation at that time, by missing its original goal.
In the end, humanity created their own doom. But, as Aries starts to slip into sleep, they think about how beautiful this new Earth will be.
As the Earth is born anew, humanity must now cease to exist. Even without humans, new lives will always emerge.
Even if not for them, hope still exists. And thus, it is not truly the end.
自宅に帰ると、皆は深い安らぎに包まれていた。それを見たアリエスはそっと隣に見を横たえ、静かに目を閉じた。
知恵ある命を悉く消し去るために造られた、惑星改造装置。石をすべて組み上げたことによって人類はその正体を現した。
運命の悪戯だったのだろうか。巨大隕石は狙いを外したことで、かえってあの時の人類の救済となっていたのだ。
畢竟、人類は自らの手で命運を決した。ふと、眠りに落ちてゆくアリエスは思った。生まれ変わる地球は、きっと美しいだろう、と。
地球が生まれ変わる今、人類は滅びなければならない。それでも、新たな命は必ず芽吹く。
人類のためではなくとも、希望は消えるまい。ゆえに、これは終わりではないのだ。
--
[Lightfall]
