Description
frog and crab music
school assignment, A+ please
Comments from authors
rareguy
We made this by keeping in mind that this song "has to be made to be as undistracting as possible". We even recorded our collaboration session and took some of the sound bites and put it in the song as a meta-reference of itself. It's not tiring to listen to multiple times.
audioTopia
Introduce: The song was created by embracing a "no thoughts, head empty" mindset be it in how we produced it and in what we wanted it to be. Beyond our goal of making a white noise-esque music to idle your thoughts, a strain-free listening experience so to speak, I don't think we put much thought into it. All the references in there were added mindlessly. Even the resident frog and crabs in the music video were just an afterthought after pondering for so long about what to put as its centrepiece. "Let's just put in a dancing frog and crab and call it a day, I guess." Most aspects of this song were pretty much impromptu, and I think that's one of the exciting ways to come up with something when life has been wearing us down lately; by not thinking too much about it!
sc.orz
This track is certified made in a goofiness. It's not my usual kind of production but I get the gist of the whole idea when rareguy invited me to collab on this. Limitation is king. As a complex composition and musical theory is not my forte, samples and recordings were helping to fill the gap of contribution. My first visual impression when this track being made is about lounge music when you select a character/car in a video game. Turns out that is a frog when it was released made it more hilarious and better than i was expecting. I am pretty happy with it, as we worked this track with limited time and such like in a hurry. Take it as a challenge, yet the result and progress satisfy me to the point where I don't need to be perfectionist to make things 😂. I hope you like it.
Chart list
Normal Lv7
Another Lv11"""

