comment = """
泣いたかどうかは覚えていない。ただ、何かが私の顔に触れるのを感じた。風ではなく、手でもなく、とても軽く、とても温かく、まだ口に出していない言葉のように、忘れられた夢の名残の温もりのようだった。
私は顔を上げた。灰色の空に細い裂け目が現れ、そこから何かの色がにじみ出ていた。白でも金でもなく、何光年もの暗闇を越えてもなお消えていない温度のようだった。雲が砕け、それに触れた瞬間に透明になった。砂糖が水に溶けるように、雪が掌で消えるように、呪いが祝福に置き換わるように。
私は立ち上がった。力があったからではなく、力よりも古い本能のために。後に分かった。裂けたのは空ではなく、私自身だった。私を包んでいた絶望と虚無は、外からの力で砕かれたのではなく、より古い力によって内側から瓦解したのだ。それには名前がない。どうしても名づけるなら、人類はかつて不器用にそれを光と呼び、希望と呼んだ。
私は最も深い場所で顔を上げ、ついにそれを見た。それはずっとそこにあり、決して消えず、決して離れず、ただ誰かが勇気を持って顔を上げるのを待っていた。"""

