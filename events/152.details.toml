Chapter 5 of 8
Years have passed since the stones first sang. Grass grows wherever they resonate, but the wasteland remains as hostile as ever.
The awe and hope that once united the survivors have curdled into greed and fear. The Stone Arch Project, an effort to gather every stone, now divides them. Some call the stones divine, while others count how many climb to the surface in their search and never return.
As the rift erupts into civil war, spilling out of the tunnels and onto the surface, Aries remembers what the stones once showed them and pleads with everyone to turn back.
But one voice is powerless against the many. And the many are powerless against the Outside.
石たちが初めて歌ってから、幾年もの月日が経った。石が共鳴する場所には草が芽吹くが、荒野は今なお過酷なままだ。
かつて生存者たちを結びつけた畏敬と希望は、いつしか欲望と恐怖へと変わり果てた。すべての石を集めようとする「Stone Arch Project」は、今や人々を引き裂いている。石を神聖なものと崇める者がいる一方で、石を求めて地上へ昇り、二度と戻らない者の数を数える者もいる。
亀裂はついに内戦へと噴き出し、トンネルから地上へと溢れ出す。その中で、アリエスはかつて石に見せられたものを思い出し、皆に引き返すよう懇願する。
だが、ひとりの声は群衆の前に無力だ。そして群衆もまた、「外」の前に無力だ。
