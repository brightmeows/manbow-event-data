...라는 생각으로 오선지에 8분의 7박자 곡을 끄적였었는데, 그게 이 곡의 출발점일지도 모르겠네요.
어떻게 보면 6년의 여정입니다.
곡의 제목이나 BGA가 나타내는 것들이라던가, 그런 것들은 이전의 Altschmerz와 Amethyst에서부터 이어지는 내용입니다.
깊은 심연에 가까운, 오래된(Alt) 고통(schmerz)으로부터 빠져나와 이상(ideal)에 다다르는 이야기라고나 할까요?
어쨌든, 여러모로 많이 아끼는 곡입니다
