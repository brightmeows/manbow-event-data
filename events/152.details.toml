chiiyuriです。
僕はSpeed Garageやいろんなベースがいっぱい鳴ってるやつ、Future Bassなどが好きなのですが、今回何作ろうか迷った結果全部作ることにしました。
作っていて、思ったより曲が平坦になったのでどこか尖らせようと思い、中盤の通称「しなこ地帯」を作りました。
その縦連でみんなの指を壊そうと思っていたのですが、作っている途中で譜面製作担当のどんべいくんに銃口を向けられたので、仕方なく「Lite Edit」として縦連緩和差分を作ることになりました。
通常INSANEは譜面製作初心者の僕が心をこめて縦連を配置したので、ぜひ遊んでみてください。
chiiyuri
ーーーーーー
はい、どんべいです。
ボーカルの32分はhyper,normalで浮くと思ってLite Edit推しやした
chiiyuri君の譜面第2作目のINSANEということで結構冒険しているような感じでしたので、私もひと肌脱いで冒険した譜面を作りました、st4くらいを狙ってます。
