[ music / bms / obj ] LuMinSo
이번 대회의 마지막 작품 KAESAR입니다
BGA 촬영이나 전체적인 디렉팅, 보면과 작곡을 맡았습니다
곡을 처음 만들 때 어느 일본의 존경하는 아티스트의 지인 분이 쓴 '신무'라던가 달의 뒷면이라던가 여러모로 참고했습니다.
