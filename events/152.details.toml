production = "汗"
comment = """
COMMENT:
テーマは、『超王道カワイイハッピーキャッチーエネルギッシュブチアゲハッピーハードコア』です。
私も皆様も大好きなハッピーハードコア、ハピコア大好きです！！といった気持ちを曲にしました。
どの年代のプレイヤーも最初に音楽ゲームに触れた時のハッピーハードコアを思い起こさせるような作品を目指しました。
BMSどころか音ゲーも完全初心者なみんなにも遊んでもらいたいので、BEGINNER☆1を作ってみました。
近年のホットなトレンド要素として、KawaiiでEnergeticなボーカルをまよりさんにお願いしました。
KawaiiムービーもSmol Mochiさんにお願いしました。ほんとうにかわいいので、みてね。(普段LR2で遊んでいる人も1回はorajaで再生して欲しいです。)
HAPPYでCATCHYでHOTだけどTHROWBACKな Capsluck feat.まより をよろしくお願いします。
殴り書き:
この楽曲、骨格は一瞬で書き上げられたのですが、完成までかなり時間かかっています。
たぶん2023年くらいから作ってます。
まよりさんのボーカルを入れた時、諸事情があって今のムービーとは違うジャケットを描いてもらった時、ムービーが送られてきた時
他の方を巻き込んだからには、本気で取り組まないといけないなと思いました。
別に今までもチームはあったし一昨年はなんだかんだボーカルとイラストをお願いし、適当にやったつもりなんて全くないのですが、明らかに気持ちが違っていました。
(一昨年のはかなり身内感はあった共作だったしね。)
そういったことは、今年の作品のクオリティーに繋がったなと思っています。
最近やっと、人を巻き込んで作品を作りたいと思えるようになれた気がします。
その他
SoundCloud, Youtubeは後ほど公開します。
最初はBMSで初見プレイして欲しいので。
いや、普通にスケジュールカツカツすぎてマスタリング終わってないだけです。"""

