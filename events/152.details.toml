production = "非公開"
comment = """
BGAは制作中です。SPa譜面は、譜面修正／追加期間に更新されます。
BGA is under construction. SPa charts will be updated during the chart revision/addition period.
BGA制作中。SPa谱面将在谱面修正/追加期更新。
AirporT
感谢您能查看我的留言！
继去年的“静かな夜、星明かりの夜”后，第二次参加bof，也是第一次在“豆”队参加比赛，请多多关照！！
话说，本队也算是曾经让我感觉离bof最近的一个队伍，毕竟有许多早时熟悉的朋友完成的bof：nt作品“Lunar”。这次的参赛也算是圆梦吧。
关于“AirporT”是从2025年初就有想法的曲名，当时沉迷于DataErr0r，一下就想到宽阔又无所依凭的机场，第二段高潮前的高速钢琴就大概是那时完成的。而本曲的其他部分主要参考了自己写高速psy音乐和Artcore的经验，组成了算是比较有特色的结构和高潮了吧。
如果有玩家游玩过我去年和今年另一首作品，可能会对本作的风格和意境感到意外吧。因为这首曲子本身就围绕着“迷茫”展开，也是自己负面情绪的累加和思考本身带来的一些内容吧。如果关注了bga可能会更有体会吧。
对于这个世界，我们本身就有很多疑问，无论是对物本身的，还是人为添加的。有些变成了好奇心，变成了探索；而有些则变成了悲伤、痛苦、绝望。我越发发现人是双面以至于多面的，一个人，有各种不同的情绪、不同的想法，它们看似矛盾而又统一。这些内涵很难用语言表达出来，我想，那就用音乐吧…这也许也是音乐的意义之一——而关于音乐，我也还在探索。也许再多的话，也比不过一句“thank you”来的情真意切，这也是在作品最后添加这个采样的意义——表达难以言说的感谢。
这次我也尝试制作了bga，并完全承担了切音工作，作为新手仍然有许多不足，请多多指教！
并且借由这个机会，也感谢队员们的谱面。
再次感谢您读完我的感想！愿明年再见！！！
Rain_Light 2026.10.19"""

