comment = """
(2026年10月16日 12:32 更新)
第一次来BOF玩!
其实从23年就开始有了参加BOF的想法，只可借当时实在苦于凑不够人数以及找不到画师和会做动画的。但今年多亏了hxd Gmy人脉大手子的发力，我们得以组成如今的
Micore_D,有着Mediocre(中庸)+core(核类音乐)+Dreams的含义
关于这首曲子，其实在两年前就有了曲子的灵感，但碍于学业原因，一直到今年借BOF的机会写成了这首曲子。——这首曲子是Hitech吗？——我觉得我是。总之在写的时候我是按Hitech的思路写的，但最终听感上和一般的Hitech又有不小的区别——就当是一些个人特色吧（
尽力给自己的和团队里两个作品写了谱子，希望玩得开心！"""

