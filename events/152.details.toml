(2026年10月20日 00:24 更新)
To highlight the so-called “artistry” of a piece, some creators include seemingly profound words in their descriptions.
However, when the music itself doesn’t actually have that much of a story to tell, these descriptions can come across as confusing and boring…
In another way, in a world that isn’t always filled with laughter, an “humorous” work still seems to be expected to be “both funny and profound”.
But this also relates to the previous point: if lacks sufficient experience, they’ll likely end up producing something that’s “neither funny nor profound”…
These are just some little insights from my creative journey.
Well, actually, this text—and even this piece itself—is actually just a forced interpretation of some messy concept just like “artistry”.
Me just wanted to make a prank chart filled with 1267 and 2356. Yay! >:)
(Translated by DeepL)
作品のいわゆる「芸術性」をアピールするために、一部のクリエイターは紹介文に深みのあるような言葉を綴ることがある。
しかし、音楽そのものにそれほど多くの物語が込められていない場合、それは不可解で退屈なものになってしまう……
別の角度から言えば、必ずしも笑いにあふれているわけではないこの世界において、優れた「ユーモア」作品には、依然として「面白く、かつ深い意味があること」が求められているようです。
とはいえ、前の点と結びつけて考えると、経験がまだ浅い場合、かえって「面白くもなく、深い意味もない」作品を作り出してしまうのではないでしょうか……
これらは、私の創作の道のりにおけるささやかな気づきです。
もちろん、もっと正確に言えば、この文章どころか、この作品そのものも、実は「芸術」といったごちゃごちゃしたもののために、無理やり意味を付与されたものに過ぎないのですがね。
私はただ、1267と2356が溢れかえる、いたずらっぽい譜面を作りたかっただけなんです。イェーイ。 >:)"""

