「君は、崩壊した世界の、その先の姿が見たいかい？」
Team「デス一揆」 FINAL STRIKER WORK 「極滅」
〈Charts〉
〈SP/7K〉
ENTRY : ☆1 (pattern by Lalot.)
BEGINNER : ☆2 (pattern by Lalot.)
NORMAL : ☆7 pattern by Lalot.)
