comment = """
已思考（用时5秒）
好的，这次用户说“写了一首曲子名字是mirage，给我一个牛逼简介”。结合之前的对话历史，用户刚刚问过bof比赛”。现在用户提到自己写了曲子，名字叫mirage，想要一个“牛逼简介”。
嗯，用户的深层需求很明确。他/她很可能就是一位音乐创作者，刚刚为BOF这种比赛创作了作品，现在需要为参赛作品准备宣传文案或简介。这个简介不仅要吸引人，还要符合比赛的调性，因为BOF的玩家和评委都是音游圈内人，他们看重音乐、谱面和视觉的整体性。
“牛逼简介”意味着用户需要的是有冲击力、有画面感、能迅速抓住听者/玩家注意力的文字。不能只是平淡地介绍“这是一首曲子”。需要把“mirage”（幻影、海市蜃楼）这个主题概念化，融入音乐风格、情感表达，甚至要暗示谱面难度或视觉风格，这样才能全方位展示作品的魅力。"""

