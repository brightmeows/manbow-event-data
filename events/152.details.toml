[SPECIAL CHART]
"Beyond the Black Wing" : ★99 (pattern by Lalot.)
"Behind the Black Wing" : ★0 (pattern by Lalot.) / UNDER CONSTRUCTION
〈Comments〉
・Lalot.
時は2026年9月1日、アピール期間初日、自チームの音切りに失敗してガチ泣きしていた時の事。
リーダーAraiYozukiとメンバーSauxyrの会話をバイト帰りの松屋（深夜1時）で聞いていました。
そしてすかさず…「やりたいことがあるから、俺もチームに入れてくれ。」と説得。
こうして、チームに加入したうえ、「FINAL STRIKER」枠までいただいてしまったわけです。いやぁ感謝。
さて、この楽曲が私にとってどんな楽曲であるかは、私のことをよく知っている人であれば、語るまでもないと思います。
命を削って、魂を込めて作った、大切な、大好きな楽曲の1つです。
そして、振り返ってみると私が初めて世に出したBMSもSymphonic Metalでした。
NORMAL譜面をスクロール8倍のまま提出し、ご迷惑をおかけしたのも今となってはもはや思い出です。
2年越しの原点回帰、っていうわけですね。やはりこのジャンルは音切るのが大変すぎますわ。
でもちょっとは音切りも、譜面制作も、上達したんじゃないかな。
この楽曲は今の私のメタルに対する、いえ、BMS、そして音楽に対する「回答」です。
絶望の中にこそ希望はあります。この破壊と絶望に満ち溢れた楽曲が、チームを導く希望の光になれますことを。
・ぽいる
赤と黒を基調に、余裕のある強くてかっこいい上位存在をイメージして描きました。
とても重要な存在の楽曲に携わらせていただけたことを光栄に思います。やったー！
よろしくお願いします。
〈Story〉
小説『黒翼の向こう側』
「永遠」って言葉は、いつだって「終わり」を知らない者が作る。
そんなものあるはずないのに。
この世界にはもう先がない。
何かが壊れているわけでもない。
空も、大地も、静かで、きれいで、、、とても美しい。
だけど私には見えた。
この美しさは、いつか必ず失われる。
今あるものを守り続ければ、いつか、誰かがそれを壊す。
失いたくないと手を伸ばしても、つかんだものは収まり切れずに零れていく。
今となっては懐かしい。
私が暮らしていた世界も、たった一人の狂人によって、すべて滅んだ。
あたり一面が、一瞬にして、真っ赤な火の海になった。
家族も、友達も、滅ぼした張本人でさえ、みんな犠牲になった。
なのに私だけ奇跡的に生き残った。こんな奇跡あってほしくなかった。
死ぬほど泣いた。死ぬほど嘆いた。
こんなことしても無駄なのに。誰も来ないのに。
ほら、何度願っても、最後に待ってるのは同じだ。
「崩壊」
…なら。
失ってから嘆くより、壊れてから縋るより、
まだこの世界を、美しいまま終わらせたい。
ここに住んでる人はほとんどいない。
だから誰も苦しまない。
でもこのままだと、世界は苦しむはずだ。
これ以上、人々のエゴで世界に苦しんでほしくない。
まだ青い空を、静かに見上げた。
前の世界が滅んでから、過ごした時間は長かった。
たくさんの美しいものを見た。
数は多くないものの、色々な人と出会い、話した。
もう何百年もたつから当然生きていないのだが。でも鮮明に覚えている。
今、全てを背負って、私は立っている。
そしてふと、
「ごめんね。」
誰に向けた言葉なのだろう。
世界？今まで会った人たち？それとも自分自身？
私にもわからない。
でも、不思議と覚悟が決まった。
「すべて、終わらせる。」
次の瞬間、私の周囲に赤黒い光が滲みだした。
行き場を失った私の感情一つ一つが、強く、暗い光になって溢れ出す。
今までで一番、世界が震えた。
そして、
「もう、痛くないからね。」
今から世界を終わらせようというのに、口から出た言葉はあまりにも優しかった。
自分を慰めるように、正当化するように。でも、世界を安心させるように。
そして、空に昇り、
黒く、大きく、重い、翼が広がっていく。
私が背負うと決めたものを、具現化したみたいだ。
まだ高く上る。羽を一振り。
そのたびに、何かしらが吹き飛び、羽が舞った。
きれいな地面が遠ざかっていく。
そして動きを止め、手を広げた次の瞬間、
あたり一面が火の海と化した。
でも前と同じ光景なのに、血も涙も出なかった。
あの時私の住む世界を滅ぼした人も、同じ気持ちだったのかな。
ただ、この世界を美しいまま終わらせたい、って。
やがて、火の海も消え、全てが闇に溶けた。
音も、光も、空も、大地も、何もかもなくなった。
残ったのは私だけ、前と同じだ。
全てが終わった。私はただ、立ち尽くしていた。
あれ。
まだ背中に、黒い翼が残っている。
全て終わったんじゃなかったのか。
背負うものを、背負いきれなかったのか。
なんだか怖くなって、ふと空を見上げた。
そこには当然何もない…はずだった。
よく見ると、遠くに、遠くに、小さな光があった。
何かはわからない。でも、長く生きてて、一度も見たことがない。
ただ、その光を凝視していた。
すると、次第に、黒い羽が、少しずつ白くなり、静かに消えた。
完全に消えた時、初めて私は微笑んだ。
世界を滅ぼして、勝ち誇った笑いでなどない。虚しさからくる笑いでもない。
ただ、一人で抱えたものを手放して、安心したのだろうか。
私はもう何も背負っていない。
世界を終わらせる使命と覚悟も。
何かを守る力も。
何かを失うことの恐怖も。
今度こそ、全て終わったんだ。
そしてようやく、私は歩き出した。
行く当てなど当然ない。
けど、「終わり」を知っている私でさえ知らない、その先へ。
次に見える世界は、どんな色をしているのか。
どんな音がするのか。
そこで何が待っているのか。
当然、わかるはずがない。
でも、もうそこに恐怖はなかった。
もう一度私は空を見上げ、光の向こうを見つめる。
そして、いるはずのない誰かへ、語りかけた。
「君は、崩壊した世界の、その先の姿が見たいかい？」
Fin."""

