comment = """
(2026年10月12日 22:16 更新)
Ukishima Enrai (浮島遠雷)
26/10/12 21:16~21:25(JST)の9分間のみ、BMSファイルのヘッダ情報を変えたZIPを配布しておりました。IRが分裂してしまうので、申し訳ありませんが、該当時間帯にDLされた方は改めてダウンロードをお願いいたします。
概要 / About
昔からBMSには、商業シーンとは異なる、ダウナーで抒情的な雰囲気を持つ作品がありました。
そうした世界観を、今の私が出来る範囲内で再解釈したのがこの曲です。
オールドスタイルなBMPBGAと併せてお楽しみいただければ幸甚です。
Ever since its early days, BMS has featured works with a melancholic atmosphere distinct from the commercial scene.
This track is my reinterpretation of that atmosphere, within the limits of my current skills.
I hope you enjoy it along with the old-school BMPBGA.
譜面について / About the charts
7種類用意しています。難易度以外に大きなコンセプト差はありませんが、プレイモード毎に若干異なる音を取っており、やけに手間がかかっています。
LIGHT7☆5 -  後半には16分やそれより細かい階段が数か所あり、難所になっています。
7KEYS☆9 -  全体的に階段譜面ですが、若干皿複合や時間差CN要素もあります。
ANOTHER7☆11 - npnd氏と共作。回復が多いのでTOTALを削りました。スコア難の譜面です。
5KEYS☆7 -  混フレ・歯抜けを減らした比較的シンプルな譜面です。
9KEYS NORMAL ☆31 -  LIGHT7をベースに少し難しくしたPMS版です。
9KEYS HYPER  ☆41 - 7KEYSに近い譜面ですが、PMSの特性上局所難要素が強くなっています。
14KEYS☆8 -  オーソドックスなDP譜面ですが、配置はやや複雑です。"""

