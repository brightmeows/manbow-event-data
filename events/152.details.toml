(2026年10月19日 01:15 更新)
【4983】
こんにちは、4983です！ 3年連続でNEO sample FACTORYチームとしてBOFに参加することになりました。こうして毎年参加できることがうれしいです！
今回のMacGuffin #26-2はTechno、その中でもPeak Time/Driving系を意図した曲です。偶然の機会でこの系統の曲を聴くことになったのですが、ヘビーなベースやインダストリアルな雰囲気などが強く印象に残ったようでラフ案を作成する際に自然とPeak Time/Driving系統で進められました。せっかくなのでいっそ深く掘り下げてみようと思い、ジャンルについてさらに研究して完成させました。これまではOldschool系を中心に制作してきましたが今回のMacGuffinは歴代シリーズの中で最新トレンドに最も近い作品になりましたね！
今回は前作とは異なり、音楽ゲームに適した展開よりもジャンルの特性を忠実に表現することに集中しました。また普段は16小節単位で展開を変えることを好みますが、長さを合わせるために8小節単位で変わることを活用しました。初めて聞いたときはぎこちなかったのですが聞いているうちに慣れてきました。皆さんはどうでしたか？
譜面は今回もSmiGoon様にご協力いただきました。いつもお手伝いいただき、ありがとうございます！
BGAはApostrophe様が担当され、私の要望ができるだけ反映されるよう努めてくださいました。本当にありがとうございます！
では、今回のMacGuffinもよろしくお願いします！
私の作品の2次創作に関するガイドラインを私のツイッターのメインツイートに設定しましたので、ぜひご参考ください！
この曲のリファレンス一覧は以下の通りです：
Control Your Mind (Original Mix) - Roger Lavelle & Innervoix
The Rave - Innervoix
WFT - Subtrax
【SmiGoon】
こんにちは、SmiGoonです。今回もNEO sample FACTORYチームに譜面制作者として参加させていただくことになりました。
今回は前回の#26と同様に、従来の固定化された譜面スタイルから脱却するよう努めました。縦連を減らしたり、これまであまり使っていなかったベースのようなオブジェクトを活用したりする形でです。慣性から抜け出そうとするのがこんなに大変だとは。
このような私の悩みを解決するために4983氏が私の意見を積極的に反映させてBMS化してくださいました。ほんとうにありがとうございます。
それでは、よろしくお願いします。
【Apostrophe】
MacGuffin #26-2 BGAに参加したApostropheです。
何か暗めの雰囲気をご希望のようなので、できる限りそうしました 暗くてどんよりした場面のことをです。
