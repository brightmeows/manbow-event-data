production = "非公開"
comment = """
雨瞳：white这个作品简直太优雅了，由请3b老师发表一下参赛感言
baka3b：第一次参加BOF，不知道说点什么www，有没有什么参考？另外，做BMS化可真累啊！
雨瞳：www主要是老师的乐曲创作简直太复杂了，可以分享一下创作思路或背景小故事什么的。
Instere：需要更多空间去欣赏作品而不是描述，所以不用想太多，就像队伍介绍也只有一句话。
雨瞳：这么美的作品不配上BGA简直太可惜了，现在小故事不能也没有!
——————————————————————————
White 自出生起便双目失明，从未见过这个世界。
她以指尖触摸花瓣的脉络，以耳畔聆听风穿过林间的声音，以心感受每一段旋律中蕴藏的情感。对她而言，世界始终是一片无法描摹的空白。她不知道天空究竟有多辽阔，也不明白阳光为何能让人露出笑容。可她从未停止想象，并将那些从未亲眼见过的景色，一点一点写进自己的音乐。
终于有一天，她完成了《Prelude in White》。
她将乐谱带至圣坛，在寂静中奏响了这首献给世界的序曲。琴声如清泉般流淌，承载着她对未知的好奇、对美好的憧憬，以及一个从未向任何人说出口的愿望——
她想看看这个世界。哪怕只有一次。
悠扬的旋律回荡在神圣的殿堂。传说中从不回应凡俗祈愿的神明，竟在这一刻动容。祂垂下目光，将一丝神性的力量赐予了这位虔诚的精灵。
于是，奇迹发生了。
White 感到眼前的黑暗开始消融。起初只是一点微弱的光，而后，光芒逐渐铺展开来，勾勒出她从未想象过的轮廓。她看见了圣坛高耸的穹顶，看见了阳光穿过彩绘玻璃，在地面投下斑斓的色彩。她看见了花朵的洁白、天空的湛蓝，以及那些曾经只能存在于她想象中的万千景象。
原来，世界是这样的。
她怔怔地望着眼前的一切，泪水无声地滑落。那是她生命中第一次，也是唯一一次，真正看见这个世界。
然而，神明的恩赐并非凡躯所能承受。
那一丝力量终究太过沉重。光芒越发耀眼，她的意识却开始一点点远去。她想伸手触摸眼前的光景，想将这一切深深铭刻于心，却连抬起手指都变得困难。
琴声渐渐微弱。
在意识彻底消散之前，她终于明白了阳光的温度从何而来，也终于看清了自己一直以来所追寻的世界。
「原来……世界，真的这么美啊。」
话音落下，琴弦归于寂静。
White 永远地睡去了。
圣坛重新恢复了平静，只有那份未曾散尽的神圣余韵，仍在空气中缓缓流转。《Prelude in White》的最后一个音符，仿佛被时间永远留在了那里。
没有人知道，沉睡的精灵是否仍能听见世界的声音，也没有人知道，那短暂的光明是否已足以让她在梦中拥有一个完整的世界。
但她留下的旋律并未终结。
她成为了后来者踏上旅途的序章，带领无数怀揣梦想的人走向未知，走向各自心中的 Wonderland。
因为对 White 而言，即使一生只能看见一次，世界也值得她用尽全部去爱。
而她所奏响的序曲，将替她继续前行。
——————————————————————————
rom the moment she was born, White had been blind. She had never seen the world with her own eyes.
She traced the delicate veins of flower petals with her fingertips, listened to the wind whispering through the forest, and felt the emotions woven into every melody with her heart. To her, the world had always been a blank canvas, vast and unknowable, beyond the reach of sight. She did not know how boundless the sky might be, nor why the warmth of sunlight could bring a smile to someone's face.
Yet she never stopped imagining.
Little by little, she poured the landscapes she had never witnessed into her music, giving shape to a world that had existed only within her dreams.
And at last, one day, she completed Prelude in White.
Carrying her sheet music to the sacred altar, she began to play her offering to the world. In the stillness of the sanctuary, her melody flowed like a crystal-clear stream, carrying her curiosity for the unknown, her longing for beauty, and a wish she had never dared to speak aloud—
She wanted to see the world.
Even if only once.
Her gentle melody echoed through the hallowed halls. And the gods, who, according to legend, had never answered the humble prayers of mortals, were moved at last. The divine gaze descended upon her, and a fragment of celestial power was bestowed upon the devoted elf.
And so, a miracle came to pass.
White felt the darkness before her begin to dissolve. At first, there was only a faint glimmer of light. Then, little by little, it spread, tracing the outlines of a world she had never even dared to imagine.
She saw the towering dome of the sanctuary. She saw sunlight filtering through stained-glass windows, scattering a thousand colors across the floor. She saw the pure white of flowers, the boundless blue of the sky, and the countless wonders that had once existed only in the depths of her imagination.
So this is what the world looks like.
She gazed at the scene before her, utterly spellbound, as tears silently slipped down her cheeks.
It was the first time in her life—
And the only time—
That she truly saw the world.
Yet the gift of the divine was more than her mortal body could bear.
The power she had been granted was too great, too heavy for her fragile vessel. The light grew ever brighter, while her consciousness began to drift away, little by little. She longed to reach out and touch the wonders before her, to etch every detail forever into her heart. But even the simple act of lifting a finger had become an impossible task.
The music began to fade.
As her consciousness slipped toward oblivion, she finally understood the warmth of sunlight. At last, she beheld the world she had spent her entire life searching for.
“So… the world really is this beautiful.”
With those words, the strings fell silent.
White closed her eyes forever.
The sanctuary returned to stillness. Only the lingering afterglow of the sacred moment remained, drifting softly through the air. The final note of Prelude in White seemed to have been suspended in time, never to fade away.
No one knew whether the sleeping elf could still hear the sounds of the world. No one knew whether that fleeting glimpse of light had been enough to grant her a complete world within her dreams.
But the melody she left behind did not end.
It became the prelude to the journeys of those who came after her, guiding countless dreamers toward the unknown, toward the Wonderland that awaited within each of their hearts.
For White, even if she could see the world only once in her entire life, it was still a world worth loving with everything she had.
And the prelude she had once played would carry her dream forward—
Long after she was gone.
Prelude in White — A fleeting glimpse of eternity.
「纵使光明只有一瞬，我也终于见过了世界。」
————————————————————————————
