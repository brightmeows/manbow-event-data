=== コメント ===
お久しぶりです。今年は急遽、Shimomuraが途中まで作った楽曲を僕の方でアレンジするという方法で制作することになりました。
Shimomuraが作り出すオリエンタルな旋律を美しく届けるために尽力しつつ、個人的な趣味もたくさんねじ込みました。どうぞお楽しみください！
(Reanisz (編曲/bms/譜面))
お久しぶりです。今回はひどい帯状疱疹で顔面を始め色んなところに麻痺が残り、作業はおろか連絡まで麻痺させてしまいましたがなんとかバトンタッチ致しました。病室でほとんど動けず無為に時間を過ごし、かと言って痺れや痛みで眠れなかったりと不安だったのを覚えています。
そしたら帯状疱疹の痕のように毒を残しそうなクラゲと、病臥の無重力のごとく煌びやか且つ寂しげなサウンドを添えていただきました。こんな偶然の連鎖ってあるもんなんですね。ありがたい限りです。恵まれ過ぎている。
帯状疱疹は神経を冒しながら進行する病気で、帯状の発疹はあくまで結果のひとつに過ぎないのです。皆様もお気をつけて。
(Shimomura (作曲))
今作はShimomuraに代わって絵コンテとグラフィック制作を担当しつつ、BGAの全体監修という形で携わりました。
kelvin_kombinatとの共同制作は初めての試みでしたが、うまいことやってくれて感謝です。
作編曲のふたりが織りなす独特な世界観に、BGAとともに浸ってもらえると嬉しいです！
(ko_nyaku (BGA))
ko_nyakuさんの指揮下で微力ながらお手伝いさせていただきました！
ShimomuraとReaniszの海のように深みのある楽曲とともにBGAもお楽しみいただけると幸いです
(kelvin_kombinat (BGA))
作曲者の方がLNを入れて欲しそうだったので、大盛りにしてみました。
海の天気ぐらいコロコロ変わるパターンとともにお楽しみください。
(ya_ti_n (譜面))
そりゃもう腕を痙攣させるつもりで押しましょう！！
(Favslater (譜面))
ロングノーツをしこたま入れようと決めていたのですが、9Keyとロングノーツは実は相性が悪く、
理不尽を感じさせないよう配置を調整するのに苦戦しました。
水族館のクラゲ展示コーナーのような浮遊感も残しつつ、やりごたえのある譜面に仕上がったと思います。
今回は深海まで潜らなくても大丈夫そうなので、お気軽に遊びに来てください。
また、こちらの楽曲は9Keyに加えて7Key(H)も担当させていただきました。味変にどうぞ。
(reme (譜面))"""

