SP - NoKANY
去年の初冬、私はひとりで街を歩いていた。冷たい風が顔に吹きつけ、まわりではさまざまな人たちがすれ違っていく。
私は彼らと同じようでいて、似ているところはひとつも見つからなかった。
私たちはそれぞれ違う方向へ、違う目的のために、違う場所へと向かっていく。
それぞれの頭の中にあるのも、同じ世界ではない。
それでも、私たちはともにこの社会を形づくっている。ひとりひとりがかけがえのない個でありながら、ひとつに溶け合っている。
私たちは冷たい風の中を、歩き、考え、少しずつこの社会の中へと沈んでいく。
けれど、たとえ同じ人波となっても、私たちは鮮やかな「自分」のままだ。
どんな肩書きも、ひとりの人間をすべて言い表すことはできない。
私たちは同じ世界で生きているのに、自分の世界から、誰かの世界を想像してみることしかできない。
この世界には、面白い人、退屈な人、優しい人、冷たい人、
そして、私たちの知らないたくさんの人がいる。
だから
もう一度
あなたのことを
ちゃんと
知りたい"""

