14Key NORMAL: ☆4 (obj: ya_ti_n)
14key HYPER: ☆7 (obj: ya_ti_n)
14key ANOTHER: ☆10 (obj: ya_ti_n)
14key INSANE: ☆12 (★3相当) (obj: ya_ti_n)
9Key Beginner: ☆10 (obj: reme)
9Key Normal: ☆24 (obj: reme)
9Key Hyper: ☆39 (obj: reme)
9Key EX: ☆42 (obj: reme)
9Key INSANE: ☆47 (obj: reme)
=== コメント ===
毎回恒例、可愛く爽快、直球でハッピーな楽曲を制作しました！しかも今回は英語ボーカルつき！
音ゲーハピコアの文脈にチップチューンとポップス風味で味を付けた、Reaniszらしい作品になってるはずです。
ぜひ気持ちよく演奏してください！
(Reanisz (作編曲/bms/譜面))
今回はあえて楽曲の歌詞やコンセプトに寄せすぎず、インスピレーション重視の自由な発想でBGAを作らせてもらいました。
ということで初めてのアニメーションにチャレンジしましたが、制作を進めるにつれ描きたいカットもどんどん増えていき……ピクセルアートでなければ危なかったです。
ハッピーでエモーショナルな物語を感じてもらえると嬉しいです！
(ko_nyaku (BGA))
今までのreaniszの曲調とは違う、すこし大人びた感じの雰囲気を譜面にしてみました！
(Favslater(譜面))
爽やかな曲調に合うような楽しげな叩き心地を目指してみました。
また、今回は初めての試みとしてSP/DP両方の発狂譜面を制作してみました。
どちらも本家皆伝の方であれば楽しめる難易度になっているので、ぜひプレイしてみてください。
(ya_ti_n (譜面))
レアンくんの宝石シリーズ(?)もついに3作目、回を重ねるごとに透明感と中毒性が増していて素敵ですね。
今回はついに宇宙まで飛び立ってしまいました。そんなことできるんや…
爽快に、軽快に、何度でも遊びたくなる正統派な譜面に仕上げました。是非楽しんでください！
(reme (譜面))"""

