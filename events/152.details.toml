≪Zris≫
A few years ago...
"Adding the latest technical terms to the title may make your work more likely to be accepted."
"Okay."
≪乃花こより≫
初めまして、乃花こよりと申します。
このたび作詞＆歌唱担当として楽曲に参加させていただきました。
ご一緒させていただいたクリエイターたちもハイセンスな方ばかりで、
今回同じチームで制作することができ、とても嬉しく思っております！
素敵なご縁をありがとうございます。
本曲はリズミカルでミステリアスで美しい、だけど遊び心にも溢れているとても魅力的な音楽です。
真夜中にこの曲を聴いて「LLM」の世界にどっぷりと浸ってもらえたら嬉しいです。
≪unKn≫
お久しぶりです、unKnです。
今回、Zrisさんと乃花こよりさんとコラボできて光栄です。ミステリアスでかっこいい曲の映像を作り、そのイメージを少しでも出せるようにしました。
一緒にやってくれたlinglvzさんのイラスト、本当に最高！好き！
イラストレーターさんとのコラボ経験、まだまだ少なすぎて、自分は全然まだまだだな～って思ってる、また一緒にできたらいいな。
最後にひとつ。MV完成が締切に近すぎて、仕事から帰ってきたらもうベッドに寝転がりたいだけだった(笑)"""

