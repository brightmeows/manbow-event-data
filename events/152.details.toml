comment_updated = "2026年10月08日 16:06"
comment = """
(2026年10月08日 16:06 更新)
안녕하세요, 처음 뵙겠습니다. ReLU입니다.
이 곡은 늘 습작만 만들어오던 제가 처음으로 끝까지 완성한 곡이자, 저뿐만 아니라 저희 팀 모두에게 첫 BOF 출전작입니다.
그만큼 작곡, 채보 제작, 키음 작업, 영상 제작까지 모든 과정에서 처음 겪는 시행착오가 정말 많았습니다. 그래도 하나씩 부딪혀가며 결국 완성해 낸 작품이라, 저에게는 여러모로 의미가 깊은 곡입니다.
자세히 보시면 저희 팀명에서도 그 시행착오의 흔적을 느껴보실 수 있을지도 모릅니다.
모두가 고통스러워하며 창작을 해나간다…!
제목인 「Rectified」는 제 활동명인 Rectified Linear Unit에서 가져왔습니다.
처음으로 완성한 작품이라는 상징성을 담아, 제 이름의 일부를 첫 작품의 제목으로 사용하고 싶었습니다.
동시에 이 이름은 곡의 컨셉과도 연결됩니다.
Rectified는 ‘바로잡다, 교정하다’라는 뜻의 rectify에서 온 말입니다.
이 곡에서는 무언가 어긋난 것을 계속해서 바로잡으려 하지만, 결국 완전히 바로잡는 데에는 실패하는 모습을 떠올렸습니다. 전개 중 등장하는 강렬하고 뒤틀린 베이스 사운드 역시 그 ‘어긋남’과 그것을 억지로 교정하려는 모습을 표현하고자 한 요소 중 하나입니다.
팀장으로서 진행한 첫 프로젝트였기에 부족한 부분도 정말 많았지만, 끝까지 함께 열심히 작업해 준 팀원분들께도 정말 감사드립니다.
저희 모두 즐겁게, 그리고 꽤 고통스럽게 창작했습니다.
부디 여러분은 즐겁게 플레이해 주세요..!
—————————
はじめまして、ReLUと申します。
この曲は、今まで習作ばかり作ってきた自分が、初めて最後まで完成させた作品です。
そして、自分だけでなくチームメンバー全員にとって、今回が初めてのBOF参加でもあります。
その分、作曲から譜面制作、キー音作業、映像制作に至るまで、何もかもが初めてで、本当にたくさんの試行錯誤がありました。
それでも一つひとつ壁にぶつかりながら、なんとか最後まで完成させることができたので、自分にとってはいろいろな意味でとても思い入れのある作品になりました。
よく見ていただくと、チーム名からもそんな試行錯誤の跡を感じ取っていただける……かもしれません。
みんな苦しみながら創作している……！
タイトルの「Rectified」は、自分の活動名である「Rectified Linear Unit」から取ったものです。
初めて完成させた作品ということで、その記念として、自分の名前の一部を最初の作品のタイトルに使いたいと思いました。
同時に、このタイトルは楽曲のコンセプトにも繋がっています。
「Rectified」は、「正す」「修正する」といった意味を持つ “rectify” から来ています。
この曲では、何かが狂ってしまったものを何度も正そうとするものの、最後まで完全には正しきれない――そんなイメージを描きました。
曲中に登場する激しく歪んだベースサウンドも、その「ズレ」と、それを無理やり正そうとする様子を表現するための要素の一つです。
チームリーダーとして進めた初めてのプロジェクトでもあり、自分自身至らないところも本当に多かったと思います。
それでも最後まで一緒に頑張ってくれたチームメンバーの皆さんには、本当に感謝しています。
自分たちはみんな、楽しく、そしてなかなかに苦しみながら制作しました。
皆さんには、ぜひ楽しくプレイしていただけたら嬉しいです……！"""

