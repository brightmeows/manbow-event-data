README
去年の年末くらいに、無名戦17のある同期の方にコラボのお誘いをしていました。ずっと憧れていた方だったので、ぜひ一緒に何か作れたらと思っていたんですが。
ところが今年の半ば頃、その方のPCが壊れてしまい、しばらく復旧できそうにないとのことで——
悔しい！！！！！！
そんな悔しさを抱えながら、「一人で二人分のコラボ感を出してみよう」と思って作り始めたのが、この曲の一つ目のテーマです。たぶん、曲調からなんとなく感じ取ってもらえるんじゃないかなと思います。
BGAは今回もTaraちゃんにお願いしました。デモを聴いてもらったところ、Taraちゃんから「plungeに出てきたあのカッコいい女をもう一回出したい」と言われたので、ちょっと微妙なやり方でplungeの続編っぽい曲にしてみました。これが二つ目のテーマです。
そして三つ目のテーマは、最近出てきたばかりのHypnotic Psytranceです。このジャンルは絶対流行ると思ってます！今回はそれを「我流Hypnotic Hi-tech PsyTechno」でやってみました。
ちなみにタイトルの「XCBA」は、某BMS制作鯖のBOFに出ない友人が出してくれた案です。読み方や意味については、プレイヤーの皆さんにお任せします。たぶん、どの言語がわかるかによって、出てくる答えも変わるんじゃないでしょうかねw
INFO
SP
SPN ☆4
SPH ☆10
SPA sl4
SP INSANE st0
