☆Compose
作曲を担当しました、鑠琵（tobi｜とび）と申します。
普段はバンドサウンドを中心に制作しているため、自分の音楽がBMSというイベントに合うのか不安もありましたが、
お誘い頂いた、ちくわ。さんからの後押しもあり、今回参加させていただく運びとなりました。
お誘いを頂いた当初、ちょうど洋楽のポップパンクやロックバンドをよく聴いていたこともあり、
英語詞を取り入れた、メロディアスでロックかつポップな楽曲にしてみたいと思い、制作しました。
楽曲の内容としては、ただ僕が、ちくわ。さんのことを知りたいという願望を曲にしました（笑）
譜面制作やBGA制作を担当してくださった皆さまには、生音を多く取り入れた楽曲ということもあり、
大変な部分も多かったかと思います。それでも、皆さまのご協力のおかげで無事に作品を完成させることができました。
本当にありがとうございます。
そして、この作品を皆さまに楽しんでいただけることを心より願っております。
どうぞよろしくお願いいたします。
＜鑠琵＞
☆illustration
初めまして
BGAを担当したsugiruです。今回は様々なご縁があり、今回BGAを任せていただいて誠にありがとうございます。実はがらくすさんと6月から相談を重ねて、もっと壮大でROCKなBGAが仕上がる予定でした。結論を申し上げますと、普通に間に合いませんでした。しかしコーヒーを深夜に飲み、一枚一枚ちくわ。さんに真摯に向き合った事実が自分の中で残っているので、悔いはありません。
私はやり切りました。
制作中に思ったことを描かせていただきますと、
ちくわ坂、いつか登れると良いな。
この一言に尽きます。
＜sugiru＞"""

