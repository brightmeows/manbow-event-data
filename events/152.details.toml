こんにちは。こんばんは。初めまして。
Vector Techのuk.です！
前からHouse系ジャンルに挑戦したかったので、今回制作してみました。
想定してたより大人しめな楽曲となっていますが、難易度的には
優しめなコンセプトで制作いたしました！
