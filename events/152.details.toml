(2026年10月20日 10:04 更新)
◆Super Yabai
出前：
20年前をリバイバルさせました。
ARMYTOM：
なんかとんでもねえチーム名のところに誘われちまったよ……
というわけでBMS界隈1・2を争う古参2名による合作です。
Crankyさんの新規メロディに、黎明期の作品を混ぜまくってみました。
◆ジャンル
ジャンル名の「アッサンブラージュ（Assemblage）」は、
音楽というよりは美術のジャンルなのですが、マッシュアップやオールミックス、
ハイパーフリップ等とは手法が完全に異なるので、そう付けました。
◆曲名
頭文字Cのあの合作曲と、頭文字Eのあの合作曲の、
ちょうど真ん中に位置する楽曲、ということで
頭文字Dの楽曲名、Disruptとしました。
◆元ネタ
往年のCranky BMSが8曲使われてますが、全部分かったあなたもまた、Super Yabaiなのだ……。
ちなみに答えは、BMSフォルダ内のファイル名を見れば分かりますが、なるべく見ないで当てて下さいね。
#Disruptの余談
上記ハッシュタグにて、armytomのXで余談を不定期ポストしてます！
https://x.com/hashtag/Disrupt%E3%81%AE%E4%BD%99%E8%AB%87?src=hashtag_click"""

