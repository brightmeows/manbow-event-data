(KR)
아~ 평안하신가요? marierie 입니다.
실사 뮤직 비디오입니다.
만들어보는 것은 처음(😉)인 실사 뮤직 비디오라 감회가 새롭네요. 기회를 주신 chilldive님께 감사드립니다.
여러분은 여러분 자신이 변한다는 것에 두려움을 느껴보신 적 있으신가요?
저는 저 자신의 버전을 항상 나누면서 살게 되는 것 같습니다.
6살 때부터 15살까지는 버전 1, 15살부터 20살까지는 버전 2, 20살부터 22살까지는 버전 3…
그리고 지금은 버전 5…단계 쯤에 접어든 것 같습니다.
(주변의 분들은 좀 어떻게 생각하실는지 모르겠습니다)
정말 많은 일이 있었지요. 여러분도 그러셨을 거라고 생각합니다.
하지만 잊지 마세요. 흑역사라고 해도, 이랬던 저도 저고, 그랬던 당신도 당신이라는 점!
과거의 본인을 용서하기란 쉽지 않은 법이지만, 사람들은 앞을 보고 사는 법이랍니다.
그리고 그 미래는 지금 당신의 행동으로부터 쓰인다구요?
정장을 입은 당신도, ‘이벤트 복장’을 입은 당신도, 모두 당신입니다.
그런 것을 되새기게 해줄 수 있는 악곡이 되었으면 좋겠군요~
아, 영상 제작자로서 악곡을 운운하는 것은 약간 주제넘으니까 영상이라고 합시다.
네. 그런 영상이 되었으면 좋겠네요.
제 진심이 제대로 전해졌을까요? 그럼, 또 어디선가 뵙죠.
(JP)
あ〜、ご機嫌いかがですか？ marierieです。
実写ミュージックビデオです。
作るのは初めて（😉）の実写MVなので、感慨深いですね。機会をくださったchilldiveさんに感謝いたします。
皆さんは、自分自身が変わっていくことに怖さを感じたことはありますか？
私はいつも、自分自身をバージョンで区切りながら生きている気がします。
6歳から15歳まではバージョン1、15歳から20歳まではバージョン2、20歳から22歳まではバージョン3…
そして今は、バージョン5…くらいの段階に入ったような気がします。
（周りの方々がどう思っているかはわかりませんが）
本当にいろんなことがありました。皆さんもきっとそうだったと思います。
でも忘れないでください。黒歴史だとしても、あんなだった私も私で、そんなだったあなたもあなただということを！
過去の自分を許すのは簡単なことではありませんが、人は前を向いて生きていくものなんですよ。
そしてその先の未来は、今のあなたの行動から書かれていくんですよ？
スーツを着たあなたも、「イベント衣装」を着たあなたも、みんなあなたです。
そんなことを思い返させてくれる楽曲になればいいですね〜
あ、映像制作者が楽曲について語るのはちょっと出過ぎた真似なので、映像ということにしましょう。
はい。そんな映像になればいいなと思います。
私の本心、ちゃんと伝わったでしょうか？ それでは、またどこかでお会いしましょう。
