あさりです。いつもお世話になっております。
今回の曲は10年前（2016年秋）に制作した1stEPのタイトル曲をBMS向けにアレンジしたもので、
当時からの正統進化的なサウンドになりました。
また、より強い印象を与えたいのでANOTHER以上の譜面は意図的に玄人向けとしています。
プレイヤーの皆様には楽しんで頂けたら嬉しいです。
（あさり）
お世話になっております毛布竜です。
