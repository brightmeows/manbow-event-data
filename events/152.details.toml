ReLU:
작곡의 경우 ReLU와 pimatT가 공동으로 담당했습니다.
자세히 들어보시면 저희 팀의 다른 작품인 Rectified와 Chronic dream의 요소와 작곡 스타일이 곳곳에 녹아 있음을 발견하실 수 있습니다. 두 곡을 이미 들어보신 분이라면 어떤 부분을 누가 담당했는지 주목해서 들어주시면 더욱 재미있을 것 같습니다.
마감 직전까지 두 작곡가가 스튜디오 룸에 모여 함께 작업했습니다. (사실 한 명이 작업하는 동안 다른 한 명은 노는 식이였지만요. ㅋㅋ) 한참 토론하고, 아무도 알아채지 못할 법한 사소한 부분을 어떻게 고칠지까지 끊임없이 고민하며 이 곡을 완성했습니다. 사실 마감 기한이 없었으면 아직까지도 토론하고 있었을지도 모릅니다. 결국 최종본은 final_realfinal_finalfinal_21에서 마무리되었는데, 무엇이 진짜 최종본인지조차 알기 어려웠습니다. ㅋㅋ
채보 작업의 경우,
ANOTHER는 john0716과 Fnel이 각각 앞부분과 뒷부분을 맡았으며, 합치는 과정에서 서로 피드백을 주고받으며 다듬어 완성한 채보입니다.
HYPER와 NORMAL은 (작곡가인) 제가 담당했습니다. 작곡하면서 '이 부분은 채보로 꼭 살리고 싶다!'고 생각했던 부분들을 최대한 반영하여 작업했습니다.
일러스트의 경우 togu87님께서 멋진 작업물을 만들어 주셨습니다! (작곡가의 취향이 약간 반영되기도 하면서) 건반과 폐허라는 곡의 컨셉을 멋지게 시각화해주셨습니다.
전원 BOF 첫 출전으로서, 부족한 부분들이 많았지만, 저희 팀의 최종 작품까지 끝까지 달려주신 팀원분들께, 정말 감사하게 생각하고 있습니다.
저희 팀이 작업하면서 느꼈던 창작의 고통과 열정이 플레이하시는 여러분께도 조금이나마 전해졌으면 좋겠습니다.
감사합니다!
Fnel:
여러분, 좋은 밤입니다.
처음뵙는 분들도 있겠네요. 처음뵙겠습니다. Fnel이라고 합니다.
FINAL STRIKER 대상곡, Keys of Fracture의 어나더 채보를 john0716님과 함께 제작했습니다.
일단 죄송하다는 말씀을 드려야겠네요.
어시클도 못했습니다. 보이는거보다 더 어려웠습니다.
그래도 여러분들이라면 깨실수 있을거라고 생각합니다.
깨지는 못했지만  그 이상으로 즐거웠어요.
악곡을 들을때, 채보를 짤때, 실제로 플레이해볼때 모든 순간이 즐거웠거든요.
플레이 안해보시면 인절손입니다.(진짜임)
한번이라도 괜찮으니까 꼭 플레이 해주세요!!
こんにちは！チーム「曲が作れません！！！」です！
今回はFinal Strikerにふさわしく、なんとチームメンバー5人全員が参加した合作です！
ReLU:
まず、作曲はReLUとpimatTの2人で担当しました。
じっくり聴いていただくと、同じく私たちのチームから参加している「Rectified」と「Chronic dream」の要素や、それぞれの作風が随所に感じられると思います。すでにこの2曲を聴いた方は、「ここはどっちが作ったんだろう？」と想像しながら聴いてみると、より楽しめるかもしれません。
締め切り直前まで、作曲担当の2人でスタジオに集まって制作していました。
（実際は、片方が作業している間、もう片方は遊んでいたりしましたが……ｗ）
あれこれ議論を重ね、誰も気づかないような細かい部分まで「どう直そうか」と悩み続けながら、ようやく完成にたどり着きました。締め切りがなかったら、今でもまだ議論していたかもしれません。
結局、最終版は「final_realfinal_finalfinal_21」に落ち着いたのですが、もはやどれが本当の最終版なのか、自分たちでも分からなくなっていましたｗ
続いて、譜面について。
ANOTHERは前半をjohn0716、後半をFnelが担当しました。2人の譜面をつなぎ合わせる際にも、お互いに意見を出し合いながら調整を重ねて仕上げています。
HYPERとNORMALの譜面は、作曲を担当した私（ReLU）が制作しました。作曲中に「この部分はぜひ譜面で活かしたい！」と思ったところを、できる限り反映しながら制作しました。
イラストはtogu87さんに素敵な一枚を描いていただきました！
作曲担当の趣味もちょっぴり反映されつつ、「鍵盤と廃墟」という楽曲のコンセプトを見事に描き出してくださいました。
メンバー全員がBOF初参加ということもあり、至らない点も多々ありましたが、チーム最後の作品まで一緒に走り抜けてくれたメンバーのみんなには、本当に感謝しています。
制作を通して私たちが味わった産みの苦しみや、作品に込めた情熱が、プレイしてくださる皆さんにも少しでも伝われば嬉しいです。
ありがとうございます！
Fnel:
皆さん、こんばんは。
初めての方ははじめまして、Fnelと申します。
FINAL STRIKER楽曲、「Keys of Fracture」のANOTHER譜面をjohn0716さんと合作で担当しました。
一応、言わせてください。
申し訳ありません。アシストイージーでもクリアできませんでした。
見た目より難しかったです。
でも、皆さんならクリアできると思います。
難しかったんですが、それ以上に楽しかったです。
何と言えばいいんでしょうか、聴く時、作る時、叩く時、全てが楽しすぎました。
プレイしないと損なんですよ。（笑）
ぜひ、一度でもいいからプレイしてみてください。"""

