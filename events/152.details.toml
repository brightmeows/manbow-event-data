こんにちは、JURUMAと申します。突然ですが、皆さんは頭の中で知らない曲が流れる経験をしたことはありますか？
本楽曲「DECISIVE[×]BREAKER」は、10年以上前からぼくの頭の中で流れ続けている曲を形にしたものです。
ざっと人生の半分近くを共に過ごしてきたので、ぼくにとっては第二の家族のような存在ですね(大げさすぎ？)。
アツくてクサいメロディの曲がとても好きなんですよね…少し時代に逆行している気もしますが、自分らしさは詰め込むことが出来たと思っています！
BGAの制作は今回初めて挑戦しました。3D動画制作って本当に大変…
