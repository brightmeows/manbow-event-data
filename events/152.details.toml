이 곡은 시간을 테마로 하고 있습니다.
자세히 들어보시면 처음부터 끝까지 시계 소리가 배경에 깔려 있습니다. 초반에는 잔잔하게 흘러가다가, 곡의 분위기가 고조되고 BPM이 빨라지는 것과 함께 시계 소리 역시 점점 빨라지는 부분이 하나의 포인트입니다.
플레이하실 때는 변속과 아르페지오에도 주목해 주시면 더욱 재미있게 즐기실 수 있을 것 같습니다.
제목에 대해서는 제출 전날까지도 팀원들과 계속 토론을 했습니다. 결국 함께 맥주를 마시다가 나온 아이디어를 최종 제목으로 채택했는데, 다음 날 술이 깬 뒤 다시 봐도 나쁘지 않은 것 같습니다. (웃음)
재미있게 즐겨주세요! 감사합니다.
———————
pimaT：「友達にやれと言われてやったんですが、大変でした……」
ReLU：「大げさすぎます。でもまあ、確かに大変ではありました。初参加で生楽器、3/4拍子、ソフランまで……」
john0716：「曲のテーマも『時間』ですが、現実の自分も締切という“時間”に追われながら作業していました……」
この曲は、「時間」をテーマにしています。
よく聴いていただくと、曲の最初から最後まで、背景で時計の音が鳴っています。 序盤では静かに時を刻んでいますが、曲が盛り上がりBPMが上がっていくにつれて、時計の音もだんだん速くなっていくところが一つのポイントです。
プレイする際は、ソフランやアルペジオにも注目していただけると、より楽しんでいただけると思います。
タイトルについては、提出前日までチームメンバーとずっと話し合っていました。 最終的には、みんなでビールを飲んでいるときに出た案をそのまま採用することになったのですが、翌日酔いが醒めてから改めて見ても、意外と悪くない気がします（笑）。
ぜひ楽しんでプレイしてください！ よろしくお願いします！"""

