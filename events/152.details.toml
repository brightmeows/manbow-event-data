comment_updated = "2026年10月08日 11:25"
comment = """
(2026年10月08日 11:25 更新)
Ju_E (BMS / Music / Chart / Movie)
안녕하세요, Ju_E입니다.
제가 처음 BMS 이벤트에 참여한 게 2016년 GENRE-SHUFFLE 3였고, 올해 10년차입니다.
한편으로 솔직히 THE BOF 대회에 매년 참여하는 것에 지쳐있습니다. 대회 자체가 갈수록 복잡해지는 문제도 있겠습니다만, 음악이나 BMS 자체에 대해 지친 것일지도 모릅니다.
매 번 저번에 만들었던 작품이 마음에 안 들어서 다음에는 더 개선하려 하지만, 항상 그렇게 시간을 많이 들이부어도 그만큼의 퀄리티가 나오지는 않더라고요. 그렇게 시간을 많이 쓴다고 해도 누가 알아주는 것도 아니고, 몇 백 개나 되는 BMS 사이에 묻혀서 의욕을 잃어가는 기분이었습니다. 이건 아마 다른 창작자 분들도 느끼는 감정 아닐까 싶네요. 아무래도 아마추어 작곡가의 한계랄까요.
그래서 올해 이벤트를 참가 포기할까 고민했지만, 포기하면 BMS 제작 10년차에 BOF 참여라는 업적 달성에 실패하기 때문에 참여했습니다.
아무튼 이런 배경 탓인지 이번에는 최대한 즐길 수 있는 방향으로 참여하기로 했습니다. 그렇기에 "즐거운 음악"을 만들자고 생각했어요. 퀄리티는 후순위로 미루고, 듣기에 즐겁고 BMS 플레이할 때도 즐거운 음악을 만들기로 했습니다. 그치만 이건 너무 추상적이잖아요? 그래서 어떤 걸 만들면 좋을지 고민하면서 평소같이 아트코어 음악도 써보기도 했는데, 대체 뭘 만들어야 할지 모르겠더라고요.
그러다가 단순하게 박수 치면서 리코더 연주하는 게 떠올랐어요. 정말 기초적이면서도 그 자체로 즐겁고, 확실한 인상을 주기에 거기서부터 아이디어를 확장해나갔습니다. 그래서 초반에는 리코더와 박수 소리 단 두 개만 사용하는데, 평소에 리코더로 이상한 걸 많이 만들어서 다들 구린 음악으로 들을까 걱정은 조금 되더라고요. ...아무튼 그것도 즐거운 건 맞으니 목적은 달성이네요.
"즐거움"에 초점을 맞추고, 처음 도입부도 동심이 느껴지니 자연스럽게 곡의 테마는 "장난감"으로 정해졌어요. 그래서 온갖 장난감 소리를 찾아서 집어넣고, 악기를 마구 바꾸거나, 중간에 두드리는 등 최대한 다채롭게 즐겁도록 만들어보았습니다. 10주년을 기념할 겸 제 2016년도 작품인 Percussion Ensemble 장르의 CuBlock, 그리고 Chiptune 장르의 Rabbit's Dream의 특징을 차용한 것도 있어요.
그 뒤로 음악 전개를 짜고 뒤엎고 다시 쓰기를 반복하며 꽤 오랜 시간을 보냈습니다. 음악은 해결했는데, BGA는 어떻게 전개할지 모르겠더라고요. 다행히 일러스트 담당으로 섭외한 Panta Rhei님이 곡과 컨셉에 맞춰서 만화 형식의 콘티를 짜오셔서 이걸 토대로 작업할 수 있었습니다. 개인적으로 바쁜 일이 많아 이제서야 작업을 시작했기에 대회 종료 이전까지 완성할 수 있기를 바라고 있습니다. 일러스트나 BGA에 대한 설명은 아마 공개된 뒤에 푸는 게 좋겠죠?
BOF 참여도 최대한 즐길 수 있는 방향이길 바랬기에, 같은 학교에서 BMS 제작에 관심있는 작곡가 분들을 모으고 개인적으로 몇 분 더 섭외하여 팀을 꾸렸습니다. 또한 채보도 즐기기 좋도록 저난이도 중심으로 제작했습니다. 다만 고난이도도 고려해서 키음은 최대한 많이 뽑아놨으니 어려움을 즐기는 분들이라면 차분을 마음껏 만들어주세요. 부디 즐겁게 플레이해주세요!
^^鼠 (Chart)
안녕하세요. BOF에서는 처음 뵙겠습니다!
Ju_E님의 곡에서 HYPER 채보를 제작한 ^^鼠 명의의 새앙쥐라고 합니다.
Ju_E님과는 같은 학교, 같은 동아리에서 함께 활동했었는데요.
저는 이미 졸업했지만, 이번 BOF22를 준비하면서 Ju_E님의 제안으로 채보 제작에 참여할 수 있게 되었습니다.
곡의 특징을 최대한 살리면서도 직접 연주하는 재미를 느낄 수 있도록 많이 고민하며 채보를 제작했습니다.
플레이하시면서 그 고민과 의도가 잘 전해졌으면 좋겠습니다!
무엇보다 Ju_E님의 곡이 정말 좋아서 채보를 만드는 내내 즐겁게 작업할 수 있었습니다.
이렇게 멋진 곡을 만들어주시고, 채보 제작에 참여할 기회를 주신 Ju_E님께 감사드립니다!
그럼 모두 즐거운 BMS 되시길 바랍니다!"""

