Hello! I made a song for BOF for the first time!
// I want to thank dsktpgrl for giving me the opportunity to join her team and contribute to BOF! So, so grateful for her and everyone else in the Discord for their kindness and patience despite my shyness and own circumstances that complicated my workflow and schedule towards the end.
// For years, it has been a dream of mine to make a song for this coveted rhythm game contest. I always thought to myself every year "One day, I'll get good enough, get picked up by a team, and make a banger of a song for them" but resigned myself to obscurity since I didn't the skill nor the connections to make it happen, so imagine my delightful surprise when I was scouted one day! I was confused at first, but I knew I had to grab the chance while it was still hot, and I'm glad I did! As a result, I poured more love and effort into this song than usual, so I really hope you injoy id. inversidesce!
