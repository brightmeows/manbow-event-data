[ABNORMAL]、[INSANE]、"Beyond the Black Wing"の３譜面は、BOF22ルール(bmsデータの修正は基本的に初稿時の各譜面のトータルノーツと演奏時間が変わっていなければ許容)にのっとったうえで、配置ミスのみ修正が行われております。わたくしの確認不足により、ご迷惑をおかけしております。
