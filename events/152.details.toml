여러분은 이 곡에서 과연 이상에 도달할 수 있을까요?
아마 굉장히 험난할 것만 같네요.
이 여정이 끝나면 일기에 꼭 써넣을 생각입니다.
그럼 모두 내년에 만나요! <('v')>
p.s. 제 개인 주소에 얼마 후 참전 과정이 올라올 예정입니다! 시간 나면 꼭 보러 와주세요!
