COMMENT
你好，我是DDD。今年是我第一次参加BOF，受到队长及相关BMS参赛者的影响，我决定参加BOF。
本曲的创作意图，是试图表现一种“遥远的熟悉感”。因此我使用了大量空虚的音色，并融入对旧时回忆的疾走感，带有个人矛盾心理的倾向。
BGA中出现的“女孩”与“猫”均为我的原创角色。相关图片及影片来源于个人拍摄，部分场景CG来源于怪核美学照片。
……
～永远是存在的～
试试吧，感谢你的游玩。
日本語 [ja-JP]
COMMENT
こんにちは、DDDと申します。本年は私にとって初めてのBOF参加となります。キャプテンならびに関連するBMS参加者の影響を受け、BOFへの参加を決意いたしました。
本楽曲の創作意図は、「遠く離れているのにどこか懐かしい感覚」を表現することにあります。そのため、空虚さを感じさせる音色を多く採用し、古き記憶を駆け抜けるような疾走感を織り交ぜ、個人的な矛盾を帯びた心理的傾向を込めております。
BGAに登場する「少女」と「猫」は、いずれも私のオリジナルキャラクターです。関連する画像および映像は個人撮影によるものであり、一部のシーンCGは怪核（ウィアードコア）美学の写真を参考に制作しております。
……
～永遠は存在する～
試してみてください。プレイしてくださり、ありがとうございます。
English [en]
COMMENT
Hello, I am DDD. This year marks my first participation in BOF. Having been influenced by my captain and fellow BMS participants, I resolved to take part in BOF.
The creative intent of this piece is to convey a "distant sense of familiarity." Accordingly, I employed numerous timbres evoking emptiness, interwoven with a rushing sensation reminiscent of traversing old memories, imbued with a tendency toward personal inner contradiction.
The "girl" and the "cat" appearing in the BGA are both my original characters. The related images and footage are derived from my personal photography, and certain scene CGs are based upon weirdcore aesthetic photographs.
……
~Eternity exists~
Give it a try, and thank you for playing."""

