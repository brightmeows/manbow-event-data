4回目のBMSです。
人間はこの世の全てを定義します。定義が人間の歴史における現在地なのです。と、定義を定義します。
皆さんも定義してみてください。ありがとうございました。
Twitter : (https://x.com/Mizumilight)
SoundCloud : (https://soundcloud.com/mizumilight)
▼マイトネリウム(BGA)
毎年恒例、MizuさんのBGA3年目みたいです。
定義する事への意義や趣を少しでも多く拾える様にビジュアルに起こしました。
定義する事自体は簡単でも、有意にする事は容易い事では無いのです。宜しくお願いします。
Twitter : (https://x.com/Meitnerium027)
Youtube : (https://youtube.com/@mt_meitnerium027)
