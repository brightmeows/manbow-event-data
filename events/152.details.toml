Background Story:
“星云是尘埃、氢气、氦气和其他电离气体聚集的星际云。
“原本是天文学上通用的名词，泛指任何天文上的扩散天体，包括在银河系之外的星系。
“星云通常也是恒星形成的区域，例如鹰星云。
“在这个区域形成的气体、尘埃和其他材料挤在一起，聚集了巨大的质量，最后大到足以形成恒星……”
最后上台前，芸望合上书、抬起头。
她遥望着夜空中闪耀的星星，和夜空下同样闪耀光芒的星瑶。
台下是涌动的光点，像整片星空被折叠进这间场馆。
无数应援棒交织成潮水般，晃得人眼眶发热。
这一刻她等了很久。
当然，无论再久也不会忘记，
当初在空荡的房间，在最灰暗的一段日子里，
第一次从耳机里传来星瑶歌声的瞬间——
仿佛封闭的世界被破开了缺口，透进光亮。
芸望在那道光里得到了救赎。
后来她开始笨拙地模仿。
在狭小的排练室对着一面墙练发声，在空无一人的街头唱给自己听。
夏夜闷热，汗顺着脖颈淌进衣领，嗓子哑了就用气声哼。
手指在空气中划拍子，想象着：
某一天，微如尘埃的她，也能站在星瑶的舞台边缘——
哪怕只是替她附上一段和声。
奇迹发生在一次雨后。
芸望攥着票根，远远望见星瑶在后台的一角休憩。
她冲上前，声音抖得不成样，想要把积攒的话语尽数倾吐——
星瑶的歌如何将她拯救，她如何想成为像她一样的人。
“你还是第一个呢！”
她笑了，令芸望有些不知所措。
随后她弯下眼眉，露出了一副不同于舞台上的，柔和的笑容：
“我期待着，将来某一天，你能把这份心声，在更大的舞台，唱给我听。”
风从二人之间穿过去，带着雨后泥土的气息。
那个瞬间起，芸望觉得自己不再是仰望星星的那团尘埃。
此后就是漫长的跋涉——
深夜把一句歌词反复咀嚼至天亮，
街头演出被雨浸湿也笑着唱完，
小舞台上对着稀稀落落的观众鞠躬......
每一次登台，她都当作朝星瑶靠近了一分；
每一次开口，她都当作朝星瑶走近了一步；
而此刻，星瑶真的就在她身边。
彩风涌来，满场欢呼。
话筒靠近，她们并肩站立，呼吸重叠。
星瑶侧过头看着她，眼里的笑意，如同雨后那天一般。
芸望开口，唱出那句藏了很久的心声——
一模一样的话语，
一模一样的心情，
却不再颤抖。
至此，尘埃聚拢，引力拉扯，
在漫长的孤独和灼烧后，也迸发出了耀眼的光芒。
台下的万千光点，温柔地包裹着，两颗终于并肩启程的恒星——
共同绘织成了一幅，色彩柔和的星云图。
Lyric:
满天繁星璀璨
不知道你是否遥看
若没有你相伴
星云仿佛不再甜甘
千百万年的长途
没有你还是有点孤独
当扮作惊喜出现在眼前
好像绵羊温柔拥入
彩风阵阵吹来
无垠宇宙
我们就这般飞船启程开
又或夜半极光下入梦
拥抱着一同绮想未来
你的目光
你的笑颜
有如星光一样洁白
所以仍想
与你一起畅谈未来"""

