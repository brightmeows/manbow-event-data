================================
A Paper Plane - 紙飛行機
紙飛行機は、誰しもが一度はトライした事があるであろう創作という行為の入口であり、
自分がいつか「創作に対する歓び」をテーマに作品を作る時にモチーフにしようと温めていた題材となります。
自分のスタイルの集大成と言ってもいいようなポップでエモーショナルな楽曲に仕上がったと思いますし、
何より自分とああああさんがBMSで積み上げてきた軌跡の面影を感じて頂けるような、合作らしい作品になったと思います。
わっふゑさんの美麗でノスタルジーな映像と共に、お楽しみ頂ければ幸いです！
(Lime)
================================
作曲部分の大体をああああ、編曲部分の大体をLimeさんが担当して、
それぞれの足りない部分を相互に補い合うような形で自然と完成までこぎつけました。
Limeさんから紡がれる１つ１つの音がキラキラしていて、
自分もそれに呼応するように自然と音を返していくような、本当に楽しい制作期間でした…！
BGAについては、自分からの強い要望でわっふゑさんにお願いさせて頂きましたっ。
今回の作品のパワーに全力でお応え頂けそうな方として、これ以上ないチョイスだったと自負しております…！
（わっふゑさん、素敵なBGAをありがとう。。。）
