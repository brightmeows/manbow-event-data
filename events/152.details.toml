comment = """
=== 譜面情報 ===
7Key BEGINNER: ☆2 (obj: Reanisz)
7Key NORMAL: ☆5 (obj: Reanisz)
7Key HYPER: ☆8 (obj: Favslater)
7Key ANOTHER: ☆11 (obj: ya_ti_n)
