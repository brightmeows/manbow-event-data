comment = """
---------Music Info--------
Genre:
Showa Hyper Kayou
Title:
未解決抒情歌
Artist:
Yoshida Mahiro ft.宮舞モカ
Lyrics:
摺り硝子越しに
擦れる燐寸の音
広間の洋燈が影を揺らす
静かな廊下を歩く
足跡から逃げるように
私は息を殺している
蓄音機が回る
同じところで跳ねる
繰り返される古い流行り歌
最後の歌詞を繰り返し
時計の針だけ進んでく
こんなに夜の空気は甘いのに
口の中は錆びた味
これがあなたとの物語ならば
いつまでも続いてほしいわ
そうよ悪いのは私
でも誰が裁けましょうか
あなたは何も知らないもの
この気持ちを胸の中に閉じ込めておくのを
あなたは許してくれなかった
被害者は私だけでいいわ
孤独を埋めるだけの愛ならば
無自覚な微笑みに染まる私の頬に
いつかあなたが気づくまで
--------BMS Info--------
Charts(Only 7Keys):
N: ☆7
H: ☆10
A: ☆11
Comment:
DLしていただきありがとうございます、Yoshida Mahiroと申します。
BMSでは割と珍しい(?)、高BPMのハネリズム曲を作ってみました。
リンゴと蜂蜜とかウソツキ横丁は雨模様みたいな曲が好きで、自分でも作ってみたいなーと思い不慣れながら頑張って作ってみました。
生楽器が中心の曲だとBMS化も大変ですね。バスコンプかけられないのつらたん。。。
レガートかどうかで音が変わるし、セクションでまとめないと定義数足りなくなるしで、セクションをまとめて書き出すことで何とか出来た。。。という感じです。
でも一番大変だったのは歌詞でした。自分が音楽を聴くとは歌詞はあまり気にしませんが、いざ作るとなると違和感ないレベルで作るだけでも一苦労でした。内容としては片思いソングになるのかなぁ。。。お相手は誰なんでしょうね？
譜面は結構癖強めですが、この曲の一番の特徴であるハネリズムを存分に味わえると思います。
Notes数のわりにLVが低めですが、リズム難・配置難が多めなので、これは個人差結構でるな~とか思いながら作っていました。
Randomかけての攻略が楽かも？
気に入ったら是非インプレ、コメントお願いします!"""

