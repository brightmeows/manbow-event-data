comment_updated = "2026年10月02日 00:06"
comment = """
(2026年10月02日 00:06 更新)
-GUTAI Music- “Cosmoplastic” by foonone
前提として、観客がアーティストの意図を完璧に推測するのが困難であるように、私自身、制作当時の自分の意図していたところは完璧には分かりません。よってこれは私という観客が私というアーティストを分析していると思って聞いて欲しいです。
チームImaginery Museumは「立体オブジェクト」をモチーフにしたBMSを制作したのですが、私は試しに、具体的な美術作品をモチーフにすることとしました。
Cosmoplasticのモチーフとしておいた立体作品は、ヨシダミノル氏(以下「ミノル氏」と呼称)の「Just Curve '67 Cosmoplastic(以下「カーブ」と呼称)」という作品です。
私が具体美術協会などの前衛的な芸術を研究していた時期にまず真っ先に好きになったのが、元永定正氏の抽象画（せのひくいおれんじ… など）と、ミノル氏の作品でした。その中でも「カーブ」が本当に好きでした。
理由を推測すると主に二つあり、一つは小さい頃から感じていた、機械のガチャガチャとした雰囲気に感じる魅力です。モーターが剥き出しになっている箇所があり、機械感が満載です。サイバーパンク？とはまた違うような気もします。（某大穴潜りアニメの主人公のロボットの男の子など）
そして二つ目が、プラスチックの持つ「無機的な質感と有機的な曲線のフォルムの共存」です。
ただのプラスチックなのに、この曲線的な造形を見ていると、これは夏に大きな木の木陰で静かに揺れる植物の葉っぱなのかもしれない、いや、暗く冷たい深海に浮かぶクラゲかもしれない、いやいや、海底を泳ぐ魚のヒレではないか？ …など想像が広がってゆきます。
これをどう音楽に落とし込むかについてはかなり悩んだものの、「機械のガチャガチャとした」というところは、パーカッションを細かく散りばめたり、シンプルな音色を前面に出したシンセサイザーを使用することで表現を試みました。プラスチックの持つ「無機的な質感と有機的な曲線のフォルムの共存」を音に落とし込むのは本当に難しく、今回はできなかったと認識しています。強いて言えばこの作品から「少ない要素で観客を魅せる洗練された作風」を読み取り挑戦した(矩形波や909、808などシンプルな素材)のではないかな、と振り返ります。（追記：これらの音色だとかなり音量を上げても音が割れないという現象に遭遇しました。LFOなど時間経過で音色が変化することがないからなのでしょうか？）
ーーーーーーーーーーーーーーーーーーーー
以下にこの楽曲が出来ていく過程の中で、重要な出来事を備忘録として記しておこうと思います。
この曲は、制作のごく初期からF Majorしようと思っていました。2年前、minusoneと言う作品を制作した時、映像のモチーフの1つとして「共感覚」というものがありました。具体的には音と色が同期した感覚です。「ド」だったら赤、「ソ」だったら青、「レ」だったらオレンジ、と言うような感じです。しかしこれは私が幼い頃に遊んでいた木琴の知育玩具の色を覚えていただけのような気がしますが、モチーフになっているミノル氏の作品には、緑、赤、青の3色が使用されています。私の共感覚もどきの視点で考えれば、これはファとドとソ、の音となります。これは個人的に非常にFメジャーっぽいなと思いました。(具体的にはFadd9っぽいので、Fメジャーにしよう、というところからスタートしました。)
Open Studioという音楽解説チャンネルが公開しているショート動画に「C Major to F Major」というものがあるのですが、このショート動画の中で司会の方がお気に入りだとおっしゃっていたコード進行「C-G7(13)-C9-F」が非常に印象に残ったので、これを先ほど述べたF Majorに移調して（感覚的に調整したので移調の過程で若干変化している可能性あり）、メロディーを乗せ、尺を伸ばしたものをメインのフレーズに置いて、楽曲作りがスタートしました。（以降このパートをAパートと呼ぶことにします。映像で言えばモノクロでコップを回している箇所から、青い歯車が回転しているシーンまでです）
この楽曲に限らずですが、この時期は、メインフレーズは作れたのに、ここからどう展開すればいいのかわからないという悩みが常にありました。ここで父に「先達の音楽の展開の仕方を分析して、自分に応用する」と言う考え方を教わりました。主に坂本龍一氏の音楽を分析して展開の手法の参考としました。（展開の手法という視点においては結果的に全く異なるものになった気がしますがそれはそれで面白いと思います。）（その結果誕生したこのパートをBパートと呼びます。トンネルの映像から始まるパートです）
そしてもう一度Aパート
2回目のAのパートの後に流れるフレーズは、直近で制作した私の未公開作品からフレーズをそのまま引用しています。過去の自分の作品のフレーズを引用すると言う手法は、最近の私の流行のようなものです。（黒いキャラクターが動くパートです）
その後一旦完成となりましたが、母に「全体的に反復的すぎる」との指摘を受けたのでもう一度様々な楽曲の展開を分析して大幅に作り直しました。（前奏、後奏や2回目Aの次に来るパートはここで生まれました。）結果自分の曲の中ではかなり明確なパート分けや展開が存在するポップな曲になったと認識しています。「展開が苦手」との指摘は父にもされることが多いので精進しようと思います。
ーーーーーーーーーーーーーーーーーーーー
以下参考作品（敬称略）
1 パートごとの参考作品
となりのトトロより「さんぽ」 特に歌い出し前のパート 展開やコード進行、並行移動で繰り返されるメロディを参考にしました。（Cosmoplasticで言えば冒頭と最後のパートです。）
Open Studio（Open Studio Jazz）「C Major to F Major」 メインフレーズのハーモニー参考（Aパート）
YELLOW MAGIC ORCHESTRA「RYDEEN」 展開について父と考えた時期の参考曲（Bパート）
坂本龍一「Asience-fast piano」 展開について父と考えた時期の参考曲（Bパート）
久石譲「風のとおり道」(Hirohashi Makiko Ver.) Bパートのハーモニー参考
玉置浩二「ファンファーレ」 母が提示した楽曲で、2回目のAのパートにおいてメロディをどのように変化させるのかの参考
岡本真夜「Smile」 母が提示した楽曲で、2回目のAのパートの後に流れるフレーズのパート参考
2 全体的に参考にした作品、音色、手法、精神性等
槇原敬之「どんなときも。」 コードの流れ、メロディーとの関係性の参考
坂本龍一 アルバム「未来派野郎」の全曲、特に「Ballet Mécanique」 アートを音楽に落とし込むというテーマ性などの参考に
ムソルグスキー「展覧会の絵」 母とピアノ曲について考えた時に話題に上がった参考曲です。楽譜が面白い
Armytom氏の作品群 特定の作品というわけではないのですが、自分の創作の無意識な領域に影響を与えているように感じます。
4 この備忘録の参考にした作品
Bitplane氏「チョウの標本」アルバム解説 備忘録の書き方、参考作品の書き方等
ーーーーーーーーーーーーーーーーーーーー
こんにちは！変わりまして映像のenonoof（エノノーフ）です。このすぐ分かる名義ネタはEBIMAYO氏に影響を受けたものでいずれ名乗ってみようと思っていましたので名乗ってみた次第です。では早速映像についてメモ
全体的な、根底にある映像のテーマは、「子供」なんだと思います。子供が適当に描いた落書きみたいな。でもそういう絵を描いているときってすっごく楽しい。そういう初期衝動的な精神性を感じられると思います。
自分で作った映像を見ると、やはり「カーブ」からの影響を感じます。緑色の曲線というモチーフが頻繁に登場し、この作品の中で重要な要素となっています。
また、foononeさんの「なんちゃって共感覚」の話と、カーブから連想した「クラゲ」から、クラゲ→円形→歯車というように、連想ゲームの容量でイメージを組み合わせるという手法も用いました。
以下に映像面で参考にした作品を列挙します。
映像の参考
Fernand Léger「Ballet Mécanique」 質感や、身近なものを撮影する手法等の参考 （20世紀初頭の実験映画です。これに影響を受けた坂本龍一氏が「Ballet Mécanique」という楽曲を制作。foononeさんはそれを参考にしたということで、私は映像面で、その源流を辿ってみました。ガラスのコップやお皿などをストップモーションみたいに動かすのは楽しかったです。お皿は没）
Armytom氏の作品群 映像面では、手描きの映像をどう動かすか、また写真の使用など、ローテクで面白いものを作る、という精神性を読み取り、参考にしたと振り返ります。"""

