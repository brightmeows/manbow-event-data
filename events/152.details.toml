さらさらと鳴る夜風が、故郷の黄砂を巻き上げ、荒野の上空をさまよっている。灯りが点々と瞬く避難所の外では、民衆で編成された哨戒班が、また交代の番を巡らせた。
深い空には、百年前からこの砂漠の上空を旋回し続けている巡航ミサイル群がある。
何世代もの子どもたちが願いを託してきた星の光に代わって。
避難所の小さなテントは粗末だが、それほど酷くもない。机も椅子もなく、かろうじて快適な寝床が一つあるだけ。炊事や着替えでさえ、共同施設で済ませるしかない。
「お母さん……まだ？ 髪が痛い」幼い声が、いらだたしげに響く。そこには少しの諦めがあった。「ただ別の場所へ避難するだけなのに、髪を編むことまでする？」
「すぐに終わるわ……」落ち着いた、それでいて少し甘やかすような低い女声が聞こえてくる。「外では身だしなみを整えておくのが礼儀よ。自分に自信を持つことにもつながるの。分かってる？」
母キュエルは、自分のひとつの私心を口にしなかった。
いつ命を落としてもおかしくないこの土地で、ただ娘の美しい姿をもう少し見ていたかっただけだった。
鏡のない避難所では、カオスライアは母の三つ編みの腕前がどれほど酷いか知らなかった。
けれど彼女の心のなかでは、母は少しのろまだが、髪をめちゃくちゃに編むことはないはずだった。
なにせ、六回編み重ねるごとに、三本の髪は元の位置に戻るのだから。
なんて簡単なこと。
「……」
死に瀕した際、彼女はなおもこの光景を必死に思い出そうとしていた。
懸命に思い出し、貪るように吸い上げる。一生のなかで数少ない、温かな思い出。
けれど、もしかすると、編んだ髪の順番は、最後には本当に元の場所へ戻っていたのかもしれない。
たとえ母がとっくに去っていても。
たとえ私がとっくに奈落へ堕ち、彼女の遅すぎた謝罪をもう聞けなくても。
さあね。
憎しみも、自責も……もういい。そんなものも、今はもうそれほど重要じゃない。
とにかく、
おかえりなさい。
