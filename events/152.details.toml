production = "Logic Pro X"
comment = """
秋黴雨
～くれないに ひたるあまつぶ つやめかし～
最近友達や同僚からYoutubeでマッチングアプリレポートしたら絶対売れると一押しされました、もるもるです。
ちなみに猥談が一番おもろい自信はあるんですが、今や会社の顔なので絶妙にやるか迷ってます。
これ読まれる時までに恋人出来ますように。
なんの話やねんって感じで今年もやってまいりましたBOF。
今年もあさりさんのもとへ。
あさりさんお誘い感謝感謝です涙。
なんとね、今期ボーナスが100も入りましたと。
スマホを買い替え、欲しい香水を買い、高級ランチに行き。
そしてもれなくアルバムも作っちゃいまして、
その中の一曲になります。
あきついり、あきついりと読みます。大事なことなので二回言いましたよ。
意味は漢字のまんまです。秋に降る梅雨くらいの雨を秋黴雨というそうです。
この曲を書いたきっかけはほんまにアルバムのためだけですね。
おととしから昨年にかけて書いた曲、
「サンタクロースとアフタークリスマスパーティ」
「ビーチ・ヴァリボー・ブリーズ」
とここまで冬と夏がそろったら、残りは春と秋やな。
これでアルバムが完成しました。
ジャンルは和Bassです。
しっとりした雨の曲を作りたいなと思いまして、
湿気がむんむんするようなムードに、雨を感じる音色、雨量の激しさを表現するベース。
アルバムの中では異色を放ちつつも、自分が一番聞き返す、クオリティ高い曲が作れました。
ところがなんですよねー、この曲4:30もあるんです。
BMS化にあたっては短く、2分もカットしちゃいました泣。
じっくり聞いてほしい。。。。ほんまに。。。
是非アルバム聞いてください（悲願）。"""

