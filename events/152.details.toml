comment_updated = "2026年10月17日 08:52"
comment = """
(2026年10月17日 08:52 更新)
【注意】譜面の中で9KEYSのレベル47 (華麗なるアンドレアビート)譜面のみLR2の動作と競合する
kaleid beat拡張定義を使用しているため、LR2では正常に再生できません。
これは隠し要素として通常のBMSプレイヤーでは普通に再生ができて、kaleid beatでプレーした時のみ
独自の拡張要素が出てくるという特殊な譜面を想定しているからです。
PMSのポーションノーツの定義を入れるとLR2では正常に再生できない事が分かったのですが、
今年のBOFではLR2の動作保証が推奨環境から外れた事と、隠し要素としての思惑から
kaleid beat専用の譜面として限定させたくない為、このような形でリリースしています。
あくまでLR2で正常再生できないのは1譜面のみで、beatorajaでの譜面動作は問題ありません。
もともとは分かる人だけ分かればいいという隠し要素のつもりで、俺自身のBMS制作スタイルも
そのつもりなのですが、チームメイトの方から具体的に理由を書いた方がいいと指摘を受けまして、
そういえば去年のAirのリミックスも最後に不可視ノーツを叩くと時間差でEndless Dreamの
オルゴールアレンジが流れるという隠し要素を誰にも言わずに忍ばせていたのですが、
インプレで触れてくれた人多分1人だったな…とか思いながら反省し、今回はここに正直に記載する事にしました。
ダウンロードありがとうございます。Mister.Himiです。
憧れの舞台であるBOFの参加もこれで3年目。
尊敬するDJ ANDREA JPさんのワンマンチームだと言われ続けて3年、
俺も俺なりにチームとして何か新しい事が出来ないかを考え続けていました。
3年も続くと、色々変わってくる事があります。
まず今までは主力のANDREAさんが当たり前のようにリーダーを務めておりましたが、
今年は趣向を変えて映像方面でも力を付けているYAN*TSさんがリーダーを務めております。
そして実は去年から、毎年FINAL STRIKERを3人でループするという方向性を決めており、
今年は俺ことMister.HimiがFSを務める番となりました。
3人で走り続けてきたからこそ色々と変わってきた事がありますが、
チームを結成した当初から実は変わっていなかったと思う事があります。
それは、ANDREAさんとYAN*TSさんは、BOF結成した当初からIIDXをリスペクトした
BMS作品を作っていた、という事！
それに対して俺は一昨年去年とIIDXではなく、BMS楽曲のリミックスを作っていました。
俺は今になってやっとこの事実に気づき、お二方とのBOFに対しての志の強さの差を痛感しました。
そんな事もあり、今年はFSという大きな枠が回ってきた事を踏まえて、
俺は初めてBMSではなくIIDXをリスペクトしたリミックス作品を作ろうと決意しました。
ただ安易にIIDXのリミックスを作るだけではリスペクトとは言えません。
言葉の都合が良いだけとも捉えられます。なので俺はチームでの仲良しの証として、
IIDXを愛してやまないDJ ANDREA JPさんをボーカルに起用する事を決めました。
ネタ重視で行くのなら、例えばThe Sampling Paradiseをリミックスして
声ネタを全部ANDREAさんに録ってもらえば恐らくウケ狙い、
ネタ曲としては大成功すると思います。
でも、単なるネタ曲ではなく、ANDREAさんの陽気で明るい声質、
ネイティブゆえのしっかりした発音を生かせる楽曲をチョイスする必要があると考えました。
単なるウケ狙いではなく、ANDREAさんが歌っているという一見ネタのように
見えつつも、実は声質がとても合ってて『ガチ』曲であるという方向性を目指したかった。
なので、選曲は考えた末にラッキーセブンが好きなANDREAさんに合わせて、
またDPが真の姿という裏の顔もあるというリスペクトを込めて、
7th Styleの名曲Cheer Trainをリミックスさせて頂いたという訳です。
歌唱をお願いした後のボーカルのやりとりや意見交換は難航するかと思いきや、
俺が最初に作成途中の曲データを見せて、『ANDREAさんにこの曲の声ネタをやってほしい、
後で詳しい内容をまとめて送りますね』と書いて準備してたら、数日後にはANDREAさんの方から
自主的にもう声を録音してデータを送ってくれていました。後は足りない部分を提示して、
すぐ追加でその音声を録音してくれて後は編集するのみの状態でした。
折角声を録ってもらえるのであまり良くないと思う出来だったとしても何度もリテイクは出しにくいよな…
とか内心思っていましたが、そんな心配は全くなくて驚きました。
あまりにもスムーズなやりとりかつしっかりした音声データを頂けたので、
ANDREAさんこういった依頼を受けてデータを用意する事は慣れていらっしゃるのかな、
流石iTunes Musicなど音楽配信サイトで最前線で活躍されているアーティストだなと思いましたね。
最初は、原曲が明るめの女性ボーカルなので、男性ボーカルの音声は違和感を感じる
かもしれません。でも何度か聴いていると、元の女性ボーカルでは物足りないように感じてくる
かなとも思っています！というか俺がそうだったので^-^;
そんな、ANDREAさんの魅力のボーカル楽曲を是非聞いてみてください！
改めて、素晴らしいボーカル音声を提供して頂いたDJ ANDREA JPさん、本当に有難う御座いました！
そして更に、BGAに関しては今年もYAN*TSさんに手掛けて頂きました！
FS枠の自分の作品にANDREAさんがボーカルで歌ってもらうという話になってから、
YAN*TSさんにも何らかの形で作品に協力して頂く事はできないかなと考えていました。
BOF登録期間が始まってもYAN*TSさん側の作品もまだ完成していなかったのですが、
そんな中でも無理を言って自分側のBGAもお願いさせて頂きました。
定期的に進捗を見せて貰ったり、途中ANDREAさんにイラストを描いてもらうように協力していて、
スムーズに作業して頂き気付けば短期間でしっかりとした物を仕上げていただきました。
もしこの曲にBGA、BGIを付けるのなら、普段のANDREAさんの貫禄のある、堂々としたイメージを
覆すようなコミカル、ユーモアな感じの雰囲気を出せればなと思っていたのですが、
YAN*TSさんの作ったBGAはまさに自分が考えていた雰囲気ドンピシャで。
最初に出来上がったBGAを見せて貰った時は再生中にニヤニヤが止まらず、
また再生が終わった後には鳥肌が止まりませんでしたね…ｗ
改めまして、素晴らしいBGAを作ってくださったYAN*TSさんも本当に有難う御座いました！
そんなわけで、いざ作品が完成してみれば、俺がFSという大きな枠を借りて、
チームメイトのお二方に協力をお願いして大きな作品が出来たと自負しています。
また、今大会のANDREAさんの曲の作品の登録コメントを見て頂いた方はお分かりの通り、
今後はこのチームとしてはBOFシリーズへの参加がないかもしれません。
でも今思えば、3回参加して、3回とも先鋒、次鋒、FS担当が毎回バラバラなのは
なかなか面白いと思いますし、最後(？)にこのタイプで各自分担して合作をしたのは
なかなかないのではないかと思ってます。
ANDREAさんだけのワンマンチームと言われようが、
裏で問題児チーム(？)とか陰口を叩かれている可能性があろうが、
俺はこのチームでここまでやれた事を誇りに思うよ。
そんなわけで、俺達のFSのBMSをよろしくお願いします。
Mister.Himi
(以下はYAN*TSさんのコメントです)
はいどうも、今年もBGA担当しました～YAN*TSです。
まさかアンドレアの3Dモデル作って動かすなんて誰も思ってもないでしょう笑
原曲のBGAを極力再現しつつお茶目なとこもあるアンドレアのキュートさを全面に引き出してみました。
実はFS一斉公開の1週間前あたりから急ピッチで作り始めててその最中、
アンドレア本人の絵も挟めたらいいな～ってアイデアが突然思い浮かんできて流石に厳しいかなって
思いつつ頼んだらジェバンニならぬアンドレアが一晩でやってくれました。(神絵感謝)
よりアンドレアワールドなユーモア溢れるBGAに仕上がったと思います^^
ではでは～
(以下はDJ ANDREA JPさんのコメントです)
こんにちは。アンドレアことDJ ANDREA JPです
俺の良い友人であるヒミさんがIIDXのCheer Trainをリミックスしているから、
「Stand by to win, Wow!」とかの声ネタを俺の声で録音したり、
それのBGAにおいてやんたすさんが作っているので
俺もKritaを使ったイラストアプリで一晩だけで頼まれたイラスト達も描いたりなどのお手伝いをしました
俺のデフォルメ版がこの楽曲のBGAにて登場しているので、
「令和版Cheer Train」みたいな感じで楽しんでくれれば嬉しいです
今後もよろしくお願いします
Enjoy.
2代目 BMS Sound Team"""

