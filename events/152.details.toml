comment = """
(2026年10月17日 18:38 更新)
布罗特（ブロアト）帝国的北方土地几乎全部被毁。为了帝国的延续，帝国下令全国进入常态化的战时状态。国家要求人们在破败的土地上继续生存、服从、繁衍，并将个人生命纳入帝国的延续之中。
一部分人逐渐选择离开社会，向已经被黑极夜毁坏的北方故乡前进。他们后来被称为：
“Keloenozvi”（カロエノズヴィ）
这个词原本只是“向北行走的一类人”，在遥远的后来逐渐获得一层淡淡的“殉道者”的含义。
多数“北行者”在离开南部聚落后即失去可追踪记录，推测其最终进入北部冻海及高纬冰原区域，并未返回。该群体未形成稳定组织结构，但在后世文学与思想体系中，被反复转述与重构，并逐渐演化为一种象征性存在，用以指代对既定世界秩序的拒绝及对极限环境的主动趋近，而这一境界则被他们称为——
“自由深冬”。（Midwinter of Unbound）
“灰色的尽头，此刻我即是冬天。此刻我无限自由，我拥有着这里所有的冻海、冰原与雪花，我心潮澎湃，在逐渐冻结的身体里完成最后一次跳动。”"""

