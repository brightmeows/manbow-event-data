production = "非公開"
comment = """
こんにちは、YtzkAです。
今回は「Caffeine Salad」のリミックスを持ってきました。
Caffeine SaladはBOF：TTでLalioさんが出した曲でして、その年のGdbGにも収録された作品です。
私はもともとLalioさんと知り合いでして、Caffeine Saladを聞いた途端‘これはBMSにしないと犯罪’だと言い、
Lalioさんをチームに入れて登録しました覚えがあります。
原曲はとてもシックで渋いカットアップ系のテクノです。
ジャンル名も「Sample Salad」で、まさにサンプルでサラダを作っているような無秩序な雰囲気が魅力的な作品です。
私が普段作る音楽とは別次元にあるみたいな曲ですね。
でもそれでこそか、私はCaffeine Saladが本当に好きでして、いつかこの曲を自分のスタイルでリミックスしてみたいと思っていました。
原曲のリズムと無秩序さを保ちながらもYtzkAらしい優しくてエモいメロディーとサウンドを作ろうと工夫しました。
このバージョンをLalioさんに聞かせてみたら、「面白いね！」と言ってくれてとても励みになりました。
（彼は創作の「面白い」の基準が大変厳しい人です）
それで今年のBOFに、Lalioさんと一緒にチームを組んでますし出してもいい？と訊いてみたらそっちもOKがでました。
ということで、Caffeine SaladのYtzkAリミックス、「カフェイン・サラダ」です。
個人的に本当に気に入ったサウンドと構成ですが、ちょっと不自然というか気持ち悪さが漂う作品だと思います。
そのグロテスクさもまた原曲をちゃんとリスペクトしての結果だと思ってくだされば幸いです。
BGAは曲名通りカフェインとサラダです。全部直接撮った実写です。
撮影後サラダは味わってみましたが、あまりおすすめはできません。
Lalioさん、サラダにコーヒーをかけると不味いですよ。
それではこれからもよろしくお願いします。"""

