(Updated October 19, 2026, 13:45)
NOTE: Hodong is a character from VOXFactory and is a vocal synthesizer.
-------------------- Information ---------------------
Genre: Misdirection
Title: Your Left, My Right
Artist: OfficialAz3 feat. Hodong (VOXFactory)
BPM: 130
BGA: Senali
Illust: LiGaYb
BMS: OfficialAz3
obj: LiGaYb (SPH)
---------------------- lang=en -----------------------
Hello! Az3 here ^^
This was written in a way to make you confusing.
The concept of this work started with my conversation with my family.
As my mom was driving her car with us back home, and when the app Waze told her to turn left, she accidentally turned right.
This ended up being the talk of my family for a week.
In short, the concept of the work relies on the perspective of what's left and right.
I had the directions set from the singer's perspective, hence why when you hear "Your Left", the patterns and the mixing puts her to right.
I also did explore more of songwriting by doing a gimmick as well, to the point where I used "left" and "right" in a different context other than directions.
Hence, the genre is named "Misdirection".
And also, it's an excuse to name a genre I cannot recognize.
I wrote this in the Discord server,
"there's subtle panning on the vocals on the verses of <--> (referring to the work)
there are instances where the vocals are panned left even tho the lyrics says 'your right'
and that will confuse the heck out of anybody
"my left" is panned left whilst "your left" is panned right, coz its panned from the singer's perspective"
This was a really fun experiment.
I hope you enjoy ^^
<- ->
I've added this comment days after I registered this work, meaning you won't see this exact comment from README.txt
I've had a lot of fun making this work and doing something with a gimmick or a concept in mind.
I was really inspired by Sasuke Haraguchi and chilldive when I made the track, hence you can hear the really strong influence on the track when it comes to arrangement and composition.
And also, I kinda want to test the limits on the vocal synthesizer Hodong by trying to make her talk instead of sing.
Lots of revisions had occurred when it comes to her singing style. It is true that she is meant to be sung from a pop style, so I adapted to that said style.
Anyways I hope you enjoy this work! Special thanks to Senali for the wonderful BGA and LiGaYb for the lovely illustration! ^^
Senali's Twitter/X account can be found here: https://x.com/Senali_chiljea
