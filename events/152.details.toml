comment = """
(2026年10月19日 17:14 更新)
BMSファイルの音量を修正しました。
「『玥伶（ユエリン）、』レイラが向かいの席に腰を下ろした。『私たちが一生のうちで決められることなんて、ほんのわずかよ。わがままに欲しいものを求めるくらい、悪いことじゃない。』
岑玥伶（ツェン・ユエリン）は、目の前の無邪気な少女を見つめ、冷ややかに笑った。『あんた、私に慈悲を施そうってわけ？前に私があんたにしたこと、忘れたの？』
『でも、あなたはまだここに座っている。』レイラが言った。『あなたが私をわかってくれようがくれまいが、構わない。でもね、あのときあなたが私をいじめてたときの顔、ちょっと心配そうな表情だったわ。』
――よくもまあ、そんな顔で平然としていられるものだ。
私は妬いているよ、レイラ。
あなたは知らないだろう。家族や友人の前で作り笑いを浮かべ、慇懃無礼に振る舞わなければならないような状況下では、私が『本当に欲しいもの』を手に入れたいと思うことなど、到底できるものではないってことを。
それでもあなたは、私や周囲からの苛立ちに耐えながら、すべてを許したような顔で、歩いていけるのかい？
たとえ、あなたの姉が、ただの幼い日の哀しい幻に過ぎなかったとしても？
ならば、歩け、レイラ。
苦しみを抱えて、それでも進め。
お前が絶望し、泣き叫び、その愚かさでズタズタになるところを見せてみろ。
だが――もしそれでもお前が折れず、本当にへこたれなかったなら、
その時は、もしかしたら私も――愛するものを手に入れる勇気を持てるかもしれない。」"""

