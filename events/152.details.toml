Music:Tiv
DLありがとうございます。燃え尽き症候群が半年以上続いているTiv（てぃぶ）です。
Bた作で燃え尽き、ステゾーで燃え尽き、BOFで燃え尽き…多分次は灰になるでしょうね。
今回は多方面で攻めに入りました。
ソフラン！縦連！！そしておっP！！！
批判なんか気にしたら負け！本能のままに行かずして作品は成り立たず！！
そんな想いが詰まった作品です。
まずは曲について
テーマは「地面を派手にいじくり回す魔法使い」
突き上げるように土を盛ったり、一瞬にして岩を砕いたりなど、そんなゴリゴリ感を出すために、
いつも以上に声ネタやアーメンを盛り込ませていただきました。
曲に表れる「強さ」って、治安の悪さで表現できると思うんですよね。
続いて「ソフラン」
速度変化をふんだんに使ってやりました。
部分的ですが同じようなことをステゾーの「Divine-Fairness」でもやらせていただきましたが、
今回は全体的にソフランが襲いかかってきます。
んまあ、こういうのって商業でもたまにあるじゃないですか。なのでやってみたかったんですよね。
自分で曲作ってんだから、色々覚えてるしソフランも余裕やろ！wと思ってたんですが…
…むずすぎやろおおおおおおお
でもこうするのが目的なんだから、ある意味成功じゃないですかねぇ（無責任）
お次に「縦連」
こちらはチームのコンセプトに倣ったものですが、結構縦連に合う曲調だったので、
テストプレイ中もしっくりきました。
あからさまな縦連打はなく、微縦のみとはいえBPMが200なのでね…結構押しにくいですよ。
最後に「おっP」
これはいつも通りですね（）
BGIは猫詩さんにお願いさせていただきました。
この度はありがとうございました！
今回のテーマに沿いながら、デカくて挑発的で妖艶な雰囲気を出せるのはこの方しかいない！！
と前々から思っていまして、ついに実現しましたと。感動モノです。
とにかくいろんな意味でてんこ盛りな怪作でアガっていただけると幸いです。
差分譜面制作は、同梱のノーツ未配置ファイル(_none)からがおすすめです。
ANOTHER以上の難易度（サビのシンセが二重）がベースのものは(_noneA)からどうぞ。
拡張子が「bmstemp」となっていますので、適宜変更してご利用ください。
報告は不要ですが、していただけると見に行きます。むしろ見たいです()
ポータルサイト(これを見ればTivがどんな人か大体わかる)
https://sukestonepyua.wixsite.com/tivsukehome
X(Twitter)(気ままにつぶやいたり宣伝したり)
https://twitter.com/tivmusic_chp
SoundCloud（音源保管はこちらで）
https://soundcloud.com/tivremisuke
YouTube（BGAや音源などを気まぐれで投稿）
https://www.youtube.com/channel/UC3pMoThTt8gpoAHPsNfIi8Q
連絡用メアド（TwitterのDMが出来ない場合の問い合わせやリンク切れ報告に）
[email protected]
BGI:猫詩
皆さん、初めましてイラストを担当させていただきました猫詩と申します。
この度はTiv様からのお誘いを頂きましてジャケットイラストとキャラクターイラストの方を制作させていただくという大変貴重な機会を頂くことが出来ました。本当にありがとうございます...！！
今回はかな～りムッチムチな爆乳お姉さんに仕上げました。ムチムチは世界を救う。
正直音ゲーのジャケットでここまでのきわどさを出しても良いものなのかと考えましたが、きっと大丈夫なんだと思います！最近は公式のアーケード音楽ゲームでも中々のきわどさのあるジャケットも増えてきましたしね...。
魔法使いにしてほしいとのことだったため、安直に魔道帽(?)のようなものを被せてみたのですが、やはり普通に被せるだけでは味気ないと感じたため、サイズを大き目にして帽子の印象を強め、まずはぱっと見で魔法使いのキャラクターであるということをわかりやすいようにデザインをしてみました。
帽子のデザインも周りに月の形をした飾りを付けることでただの帽子ではなく、少し飾りっけのあるお姉さんが使用しているような帽子になっております。そうすることで少しでも妖艶さを表現することができていたらな...と思っております。
何より今回は立ち絵の制作ということだったため、シルエットというものにかなりこだわりを持って制作をさせていただきました。
ただの魔法使いのお姉さんを描いただけではほかの魔法使いキャラと差別化をすることが難しいと考えたため、上記でもあった通り、あえて帽子のサイズを大き目にしてデフォルメキャラとしての印象を付ける、頭の後ろ部分に土星を付けることによってシルエットに特徴付ける、マントの外側にさらに布のデザインをあしらう...といったように、シルエットとしてみた時にこれは「爛弩という曲のジャケットのキャラなんだな」という風に認識して頂けるように工夫を施しています。
後は色々と大きく描かせていただきました。
改めてにはなりますが、まずはこのような機会を設けてくださったTiv様、お誘いしていただきまして本当にありがとうございました。
そして、こちらを見てくださっているプレイヤーの皆さんも本当にありがとうございます。
難しい譜面になっており、挑戦しがいのある難易度になっているかとおもいますが、ムチムチのお姉さんを見ることをモチベにたくさん挑戦していただいて、たくさん遊んでいただければなと思います。
それでは、私からのご挨拶はこの辺にさせていただきたいと思います。
私もいち音ゲーマーとしてたくさん挑戦したいと思います！それでは、またどこかでお会いしましょう。
ありがとうございました！"""

